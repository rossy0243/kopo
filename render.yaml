# Mise en ligne du Kopo sur Render : le serveur (offre Starter : toujours allumé, ≈ 7 $/mois)
# et la page du jeu (site statique, gratuit). Render lit ce fichier : Dashboard → New → Blueprint → choisir le dépôt kopo.
services:
  - type: web
    name: kopo-serveur
    runtime: node
    plan: starter
    region: frankfurt          # le plus proche de l'Afrique centrale chez Render
    buildCommand: cd server && npm ci --omit=dev
    startCommand: node server/src/index.js
    healthCheckPath: /sante
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: SECRET_SERVEUR        # signe les jetons des joueurs : généré par Render
        generateValue: true
      - key: DATABASE_URL          # Supabase → Project Settings → Database → Connection string (mode « Session »)
        sync: false
      - key: SUPABASE_URL          # Supabase → Project Settings → API → Project URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY # Supabase → Project Settings → API Keys → service_role (secret) : efface l'utilisateur Google quand un joueur supprime son compte
        sync: false
      - key: ADMIN_MOT_DE_PASSE    # mot de passe du tableau de bord (long, unique)
        sync: false
      - key: ADMIN_TOTP            # secret du code à 6 chiffres : node server/src/outils.js totp
        sync: false
      - key: CONNEXION_GOOGLE      # 1 = bouton « Se connecter avec Google » (Google est activé dans Supabase)
        value: "1"
      - key: ORIGINES              # pages autorisées à appeler le serveur
        value: https://rossy0243.github.io,https://kopo.onrender.com,capacitor://localhost,https://localhost

  # Page du jeu (remplace GitHub Pages, pour pouvoir passer le dépôt en privé).
  # Seuls la page, le manifeste, les icônes et les pages légales sont publiés (pas le code du serveur).
  - type: web
    name: kopo
    runtime: static
    buildCommand: node build.js && rm -rf _site && mkdir _site && cp -r index.html manifest.webmanifest icons legal _site/
    staticPublishPath: _site
    autoDeploy: true
    envVars:
      - key: SITE_URL              # adresse publique du site (aperçus des liens partagés)
        value: https://kopo.onrender.com/
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache            # le téléphone revérifie la page à chaque ouverture (nouvelle version tout de suite)
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
