# Mise en ligne du Kopo sur Render : le serveur (offre Starter : toujours allumé, ≈ 7 $/mois)
# et la page du jeu (site statique, gratuit). Render lit ce fichier : Dashboard → New → Blueprint → choisir le dépôt kopo.
services:
  - type: web
    name: kopo-serveur
    runtime: node
    plan: starter
    region: frankfurt          # le plus proche de l'Afrique centrale chez Render
    buildCommand: cd server && npm ci --omit=dev
    startCommand: node server/src/index.js
    healthCheckPath: /sante
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: SECRET_SERVEUR        # signe les jetons des joueurs : généré par Render
        generateValue: true
      - key: DATABASE_URL          # Supabase → Project Settings → Database → Connection string (mode « Session »)
        sync: false
      - key: SUPABASE_URL          # Supabase → Project Settings → API → Project URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY # Supabase → Project Settings → API Keys → service_role (secret) : efface l'utilisateur Google quand un joueur supprime son compte
        sync: false
      - key: ADMIN_MOT_DE_PASSE    # mot de passe du tableau de bord (long, unique)
        sync: false
      - key: ADMIN_TOTP            # secret du code à 6 chiffres : node server/src/outils.js totp
        sync: false
      - key: CONNEXION_GOOGLE      # 1 = bouton « Se connecter avec Google » (Google est activé dans Supabase)
        value: "1"
      - key: VAPID_PUBLIC          # notifications push : clé publique (node server/src/outils.js vapid)
        sync: false
      - key: VAPID_PRIVE           # notifications push : clé privée (secrète), créée avec la clé publique
        sync: false
      - key: VAPID_CONTACT         # adresse de contact pour les services de push (mailto:… ou https://…)
        value: mailto:contact@masano.online
      - key: FCM_COMPTE_SERVICE    # push des applis Android/iOS : JSON du compte de service Firebase (ou ce JSON en base64)
        sync: false
      - key: LIVEKIT_URL           # micro des abonnés Kopo+ : wss://<projet>.livekit.cloud (LiveKit Cloud → Settings)
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: SUPABASE_ANON_KEY     # clé publique « anon » de Supabase, donnée aux applis pour la connexion Google
        sync: false
      - key: SUPPORT_URL           # page ou adresse de contact affichée dans l'appli
        value: mailto:contact@masano.online
      - key: ORIGINES              # pages autorisées à appeler le serveur
        value: https://rossy0243.github.io,https://kopo-d655.onrender.com,https://masano.online,https://www.masano.online,capacitor://localhost,https://localhost

  # Page du jeu (remplace GitHub Pages, pour pouvoir passer le dépôt en privé).
  # Seuls la page, le manifeste, le service worker, les icônes, les pages légales et les pages de partage kopo/ et inter8/ sont publiés (pas le code du serveur).
  - type: web
    name: kopo
    runtime: static
    buildCommand: node build.js && rm -rf _site && mkdir _site && cp -r index.html manifest.webmanifest sw.js icons legal _site/ && cp -r _partage/. _site/
    staticPublishPath: _site
    autoDeploy: true
    envVars:
      - key: SITE_URL              # adresse publique du site (aperçus des liens partagés)
        value: https://masano.online/
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache            # le téléphone revérifie la page à chaque ouverture (nouvelle version tout de suite)
      - path: /*
        name: X-Content-Type-Options
        value: nosniff

  # Page de téléchargement de l'appli Android (app.masano.online) : dossier telecharger/ seul.
  # Le bouton pointe sur /masano.apk, redirigé vers le fichier de la release GitHub : pour publier
  # un nouvel APK, il suffit de changer la destination ci-dessous (les liens partagés restent bons).
  - type: web
    name: masano-app
    runtime: static
    buildCommand: echo "page statique"
    staticPublishPath: telecharger
    autoDeploy: true
    buildFilter:
      paths:
        - telecharger/**
        - render.yaml
    routes:
      - type: redirect
        source: /masano.apk
        destination: https://github.com/rossy0243/kopo/releases/download/apk-test/masano.apk
      - type: redirect
        source: /apk
        destination: https://github.com/rossy0243/kopo/releases/download/apk-test/masano.apk
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /img/*
        name: Cache-Control
        value: public, max-age=604800
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
