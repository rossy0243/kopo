# Construit l'APK Android de l'appli (mobile/) et le met en téléchargement sur la page du run (« Artifacts »).
# Lancement : à chaque fusion sur main qui touche l'appli (mobile/), ou à la main (onglet Actions > APK Android > Run workflow).
# Une PR qui touche l'appli construit aussi l'APK (vérification), sans le publier. Seul main publie : l'APK de app.masano.online est donc toujours celui de main, jamais celui d'une branche en cours.
# Construit aussi le fichier AAB du Google Play Store (artefact « masano-play-aab »), à envoyer à la main dans la Play Console.
# Clé de signature fixe : secrets ANDROID_CLE_BASE64 et ANDROID_CLE_MOT_DE_PASSE (voir mobile/README.md, « Publication Android »).
# Sans eux, l'APK est signé avec une clé de test (il s'installe, mais ne se met pas à jour par-dessus une autre version)
# et l'AAB n'est pas construit (la Play Console le refuserait).
name: APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/apk.yml']
  pull_request:
    paths: ['mobile/**', '.github/workflows/apk.yml']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9  # Flutter 3.50 exige l'AGP 9.1.1, le projet est en 9.1.0
          cache: true
      - run: flutter --version
      - run: flutter pub get
      # Clé de signature fixe : une mise à jour ne s'installe par-dessus l'ancienne qu'avec la même clé, et la Play Console
      # refuse tout fichier signé avec une autre clé que la première envoyée.
      - name: Clé de signature
        id: cle
        env:
          CLE: ${{ secrets.ANDROID_CLE_BASE64 }}
          MDP: ${{ secrets.ANDROID_CLE_MOT_DE_PASSE }}
        run: |
          if [ -z "$CLE" ] || [ -z "$MDP" ]; then echo "::warning::Secrets ANDROID_CLE_BASE64 / ANDROID_CLE_MOT_DE_PASSE absents : APK signé avec une clé de test, pas de fichier pour le Play Store."; echo "ok=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "$CLE" | base64 -d > android/app/masano.jks
          printf 'storeFile=masano.jks\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=masano\n' "$MDP" "$MDP" > android/key.properties
          echo "Empreinte SHA-256 (attendue : 2B:1C:A9:47:…:F8:E5:2A) :"
          keytool -list -v -keystore android/app/masano.jks -storepass "$MDP" | grep 'SHA256:'
          echo "ok=1" >> "$GITHUB_OUTPUT"
      # Numéro de version (versionCode) : celui du run, qui ne fait que monter. Le Play Store refuse un numéro déjà envoyé.
      # Le nom de version (1.0.0) vient de pubspec.yaml.
      - run: flutter build apk --release --build-number=$((100 + ${{ github.run_number }}))
      # Version Play Store : sans achat en francs ni mobile money (Google impose sa propre facturation, voir Api.sansAchats).
      - name: Fichier du Play Store (AAB)
        if: steps.cle.outputs.ok == '1'
        run: flutter build appbundle --release --dart-define=STORE=play --build-number=$((100 + ${{ github.run_number }}))
      - uses: actions/upload-artifact@v4
        if: steps.cle.outputs.ok == '1'
        with:
          name: masano-play-aab
          path: mobile/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: masano-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
      # Lien direct, téléchargeable sur le téléphone sans compte GitHub : version « apk-test » (remplacée à chaque construction).
      - name: Publier dans la version apk-test
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk masano.apk
          gh release delete apk-test --yes --cleanup-tag || true
          gh release create apk-test masano.apk --prerelease --target "$GITHUB_SHA" \
            --title "APK de test Masano" \
            --notes "APK Android de Masano. Construit depuis $GITHUB_SHA."
