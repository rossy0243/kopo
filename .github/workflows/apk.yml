# Construit l'APK Android de l'appli (mobile/) et le met en téléchargement sur la page du run (« Artifacts »).
# Lancement : à chaque fusion sur main qui touche l'appli (mobile/), ou à la main (onglet Actions > APK Android > Run workflow).
# Une PR qui touche l'appli construit aussi l'APK (vérification), sans le publier. Seul main publie : l'APK de app.masano.online est donc toujours celui de main, jamais celui d'une branche en cours.
# Sans les secrets de publication, l'APK est signé avec une clé de test : il s'installe, mais ne remplace pas
# une version du Play Store.
name: APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/apk.yml']
  pull_request:
    paths: ['mobile/**', '.github/workflows/apk.yml']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9  # Flutter 3.50 exige l'AGP 9.1.1, le projet est en 9.1.0
          cache: true
      - run: flutter --version
      - run: flutter pub get
      # Clé de signature fixe (secrets ANDROID_CLE_BASE64 et ANDROID_CLE_MOT_DE_PASSE, voir mobile/README.md) :
      # Android ne vérifie les liens masano.online (App Links) que si l'empreinte de la clé est celle de
      # .well-known/assetlinks.json, et une mise à jour ne s'installe par-dessus l'ancienne qu'avec la même clé.
      # Sans les secrets, l'APK est signé avec une clé de test qui change à chaque construction.
      - name: Clé de signature
        env:
          CLE: ${{ secrets.ANDROID_CLE_BASE64 }}
          MDP: ${{ secrets.ANDROID_CLE_MOT_DE_PASSE }}
        run: |
          if [ -z "$CLE" ] || [ -z "$MDP" ]; then echo "::warning::Secrets ANDROID_CLE_BASE64 / ANDROID_CLE_MOT_DE_PASSE absents : APK signé avec une clé de test, les liens masano.online n'ouvriront pas l'appli d'eux-mêmes."; exit 0; fi
          echo "$CLE" | base64 -d > android/app/masano.jks
          printf 'storeFile=masano.jks\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=masano\n' "$MDP" "$MDP" > android/key.properties
          echo "Empreinte (doit être dans .well-known/assetlinks.json) :"
          keytool -list -v -keystore android/app/masano.jks -storepass "$MDP" | grep 'SHA256:'
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: masano-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
      # Lien direct, téléchargeable sur le téléphone sans compte GitHub : version « apk-test » (remplacée à chaque construction).
      - name: Publier dans la version apk-test
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk masano.apk
          gh release delete apk-test --yes --cleanup-tag || true
          gh release create apk-test masano.apk --prerelease --target "$GITHUB_SHA" \
            --title "APK de test Masano" \
            --notes "APK Android de test (signé avec la clé de test). Construit depuis $GITHUB_SHA."
