<style>
:root { --fond: #10233a; --fond-2: #183252; --ligne: rgba(226,176,74,.25); --laiton: #e2b04a; --encre: #f4ecd8; --muted: #9fb2c8; --rouge: #c7362f; --vert: #5fae6e; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--fond); color: var(--encre); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; align-items: center; gap: 16px; padding: 12px 20px; border-bottom: 1px solid var(--ligne); position: sticky; top: 0; background: var(--fond); z-index: 2; flex-wrap: wrap; }
.logo { font: 400 28px/1 "Bebas Neue", Impact, sans-serif; letter-spacing: 3px; color: var(--laiton); display: flex; align-items: center; gap: .22em; }
.logo img { width: 1.05em; height: 1.05em; border-radius: 22%; }
nav { display: flex; gap: 4px; flex-wrap: wrap; }
nav button { background: none; border: 1px solid transparent; color: var(--muted); padding: 7px 12px; border-radius: 8px; font: inherit; cursor: pointer; display: flex; gap: 6px; align-items: center; }
nav button[aria-current="page"] { color: var(--laiton); border-color: var(--ligne); background: var(--fond-2); }
nav .badge { background: var(--rouge); color: #fff; border-radius: 9px; padding: 0 6px; font-size: 12px; }
main { padding: 20px; max-width: 1200px; margin: 0 auto; }
h2 { font: 400 30px/1 "Bebas Neue", Impact, sans-serif; letter-spacing: 2px; color: var(--laiton); margin: 8px 0 16px; }
h3 { font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--laiton); margin: 22px 0 10px; }
.tuiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
.tuile { background: var(--fond-2); border: 1px solid var(--ligne); border-radius: 12px; padding: 14px; }
.tuile b { display: block; font-size: 30px; font-variant-numeric: tabular-nums; }
.tuile small { color: var(--muted); }
.carte { background: var(--fond-2); border: 1px solid var(--ligne); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid rgba(255,255,255,.06); vertical-align: top; }
th { color: var(--muted); font-weight: 500; font-size: 13px; }
td.n, th.n { text-align: right; }
.btn { background: rgba(255,255,255,.07); border: 1px solid var(--ligne); color: var(--encre); border-radius: 8px; padding: 7px 12px; font: inherit; cursor: pointer; }
.btn.principal { background: var(--laiton); color: #1d1606; border-color: var(--laiton); font-weight: 600; }
.btn.danger { border-color: var(--rouge); color: #ffb4ae; }
input, select, textarea { background: #0b1a2c; border: 1px solid var(--ligne); color: var(--encre); border-radius: 8px; padding: 8px 10px; font: inherit; }
.ligne { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 8px 0; }
.muted { color: var(--muted); }
.ok { color: var(--vert); } .ko { color: #ff8a80; }
.lien { color: var(--laiton); cursor: pointer; text-decoration: underline; background: none; border: 0; font: inherit; padding: 0; }
#connexion { max-width: 360px; margin: 12vh auto; display: grid; gap: 12px; }
#connexion .logo { font-size: 56px; text-align: center; justify-content: center; }
.graphe { width: 100%; height: 180px; }
.graphe text { fill: var(--muted); font-size: 11px; }
.legende { display: flex; gap: 14px; font-size: 13px; color: var(--muted); }
.legende i { display: inline-block; width: 12px; height: 3px; vertical-align: middle; margin-right: 5px; }
.message { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--fond-2); border: 1px solid var(--laiton); padding: 10px 16px; border-radius: 10px; z-index: 5; }
.ico-k { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.ico-k .acc { fill: var(--rouge); stroke: none; }
.statut-banni, .statut-suspendu { color: #ff8a80; }
</style>

async function api(chemin, opt = {}) {
  const r = await fetch('/admin/api' + chemin, { method: opt.methode || 'GET', headers: { 'content-type': 'application/json', authorization: 'Bearer ' + jeton }, body: opt.corps ? JSON.stringify(opt.corps) : undefined });
  if (r.status === 401 && chemin !== '/connexion') { deconnexion(); throw new Error('Session expirée.'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.erreur || 'Erreur ' + r.status);
  return j;
}

// --- Graphe en lignes (séries sur 30 jours)
function graphe(donnees, series) {
  const L = 900, H = 180, g = 30, b = 22;
  const max = Math.max(1, ...donnees.flatMap((d) => series.map((s) => d[s.cle] || 0)));
  const x = (i) => g + (i * (L - g - 8)) / Math.max(1, donnees.length - 1);
  const y = (v) => H - b - (v / max) * (H - b - 10);
  const lignes = series.map((s) => `<polyline fill="none" stroke="${s.couleur}" stroke-width="2.2" stroke-linejoin="round" points="${donnees.map((d, i) => x(i) + ',' + y(d[s.cle] || 0)).join(' ')}"><title>${esc(s.nom)}</title></polyline>`).join('');
  const reperes = [0, Math.round(max / 2), max].map((v) => `<line x1="${g}" x2="${L}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(255,255,255,.07)"/><text x="${g - 4}" y="${y(v) + 4}" text-anchor="end">${nb(v)}</text>`).join('');
  const jours = donnees.map((d, i) => (i % 7 === 0 || (i === donnees.length - 1 && i % 7 >= 3)) ? `<text x="${x(i)}" y="${H - 4}" text-anchor="middle">${new Date(d.jour).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' })}</text>` : '').join('');
  return `<div class="legende">${series.map((s) => `<span><i style="background:${s.couleur}"></i>${esc(s.nom)}</span>`).join('')}</div>
    <svg class="graphe" viewBox="0 0 ${L} ${H}" preserveAspectRatio="none" role="img" aria-label="${esc(series.map((s) => s.nom).join(', '))} sur 30 jours">${reperes}${lignes}${jours}</svg>`;
}
const tuile = (v, t, s) => `<div class="tuile"><b>${v}</b>${esc(t)}${s ? `<br><small>${esc(s)}</small>` : ''}</div>`;

        <p class="muted">${f.parcours ? `Parcours : ${nb(f.parcours.xp)} XP, ${f.parcours.gratuits} paliers gratuits et ${f.parcours.plus} Kopo+ récupérés · ` : ''}${f.inventaire.length ? 'Possède : ' + f.inventaire.map((o) => esc(o.objet)).join(', ') : 'Aucune apparence gagnée ou achetée.'}</p>
        <h3>Corriger le solde</h3>
        <div class="ligne"><input id="pMontant" type="number" placeholder="+100 ou -50" style="width:130px"><input id="pMotif" placeholder="Motif (obligatoire)" style="flex:1;min-width:200px"><button class="btn" id="btnPieces">Corriger</button></div>
      </div>
      ${f.partenaires.length ? `<h3>Joue souvent avec</h3><p class="muted">Utile pour repérer la complicité aux tables à mise.</p><div class="carte"><table>${f.partenaires.map((p) => `<tr><td><button class="lien" data-joueur="${esc(p.id)}">${esc(p.pseudo)}#${p.numero}</button></td><td class="n">${p.ensemble} parties ensemble</td></tr>`).join('')}</table></div>` : ''}
      <h3>Signalements reçus (${f.signalementsRecus.length})</h3>
      <div class="carte"><table>${f.signalementsRecus.map((s) => `<tr><td>${date(s.cree_le)}</td><td>${esc(s.motif)}</td><td>${esc(s.details || '')}</td><td class="muted">par ${esc(s.auteur)}</td><td>${esc(s.statut)}</td></tr>`).join('') || '<tr><td class="muted">Aucun.</td></tr>'}</table></div>
      <h3>Sanctions</h3>
      <div class="carte"><table>${f.sanctions.map((s) => `<tr><td>${date(s.cree_le)}</td><td>${esc(s.type)}</td><td>${esc(s.motif)}</td><td>${s.jusqu ? "jusqu'au " + date(s.jusqu) : ''}</td></tr>`).join('') || '<tr><td class="muted">Aucune.</td></tr>'}</table></div>
      <h3>Dernières parties</h3>
      <div class="carte"><table><tr><th>Date</th><th>Code</th><th class="n">Joueurs</th><th class="n">Place</th><th></th></tr>${f.parties.map((p) => `<tr><td>${date(p.debut)}</td><td>${esc(p.code)}</td><td class="n">${p.nb_joueurs}</td><td class="n">${p.place ?? '—'}</td><td>${p.avec_robots ? '<span class="muted">robots</span>' : ''}${p.abandon ? ' <span class="ko">abandon</span>' : ''}</td></tr>`).join('') || '<tr><td class="muted">Aucune.</td></tr>'}</table></div>
      <h3>Registre des pièces</h3>
      <div class="carte"><table><tr><th>Date</th><th>Motif</th><th class="n">Montant</th><th></th></tr>${f.pieces.map((p) => `<tr><td>${date(p.cree_le)}</td><td>${esc(MOTIFS[p.motif] || p.motif)}</td><td class="n ${p.montant < 0 ? 'ko' : 'ok'}">${p.montant > 0 ? '+' : ''}${nb(p.montant)}</td><td class="muted">${p.par_admin ? 'admin · ' + esc(p.ref || '') : ''}</td></tr>`).join('')}</table></div>`;
    $('#retour').onclick = () => aller('joueurs');
    $('#btnSanction').onclick = async () => {
      const type = $('#sType').value;
      if (!$('#sMotif').value.trim()) return message('Indique un motif.');
      if ((type === 'bannissement' || type === 'suspension') && !confirm(`Confirmer : ${type} de ${c.pseudo}#${c.numero} ?`)) return;
      try { await api(`/joueurs/${encodeURIComponent(id)}/sanction`, { methode: 'POST', corps: { type, motif: $('#sMotif').value, jours: Number($('#sJours').value) } }); message('Sanction appliquée.'); aller('fiche', id); } catch (e) { message(e.message); }
    };
    $('#btnKopoPlus').onclick = async () => { try { await api(`/joueurs/${encodeURIComponent(id)}/kopo-plus`, { methode: 'POST', corps: { jours: Number($('#kpJours').value) } }); message('Kopo+ mis à jour.'); aller('fiche', id); } catch (e) { message(e.message); } };
    $('#btnObjet').onclick = async () => { try { await api(`/joueurs/${encodeURIComponent(id)}/objet`, { methode: 'POST', corps: { objet: $('#objOffert').value.trim() } }); message('Apparence offerte.'); aller('fiche', id); } catch (e) { message(e.message); } };
    $('#btnPieces').onclick = async () => {
      try { await api(`/joueurs/${encodeURIComponent(id)}/pieces`, { methode: 'POST', corps: { montant: Number($('#pMontant').value), motif: $('#pMotif').value } }); message('Solde corrigé.'); aller('fiche', id); } catch (e) { message(e.message); }
    };
    lierJoueurs();
  },

  async signalements(statut = 'ouvert') {
    const l = await api('/signalements?statut=' + statut);
    $('#contenu').innerHTML = `<h2>Signalements</h2>
      <div class="ligne">${['ouvert', 'traite', 'rejete'].map((s) => `<button class="btn ${s === statut ? 'principal' : ''}" data-statut="${s}">${{ ouvert: 'À traiter', traite: 'Traités', rejete: 'Rejetés' }[s]}</button>`).join('')}</div>
      <div class="carte"><table><tr><th>Date</th><th>Joueur signalé</th><th>Motif</th><th>Détails</th><th>Par</th><th></th></tr>
      ${l.map((s) => `<tr><td>${date(s.cree_le)}</td><td><button class="lien" data-joueur="${esc(s.cible_id)}">${esc(s.cible_pseudo)}#${s.cible_numero}</button><br><small class="muted">${s.total_cible} signalement(s) · <span class="statut-${s.cible_statut}">${esc(s.cible_statut)}</span></small></td><td>${esc(s.motif)}</td><td>${esc(s.details || '')}</td><td class="muted">${esc(s.auteur_pseudo)}#${s.auteur_numero}</td>
        <td>${statut === 'ouvert' ? `<button class="btn" data-traiter="${s.id}">Traité</button> <button class="btn" data-rejeter="${s.id}">Rejeter</button>` : esc(s.decision || '')}</td></tr>`).join('') || '<tr><td colspan="6" class="muted">Rien à traiter.</td></tr>'}
      </table></div><p class="muted">Pour sanctionner, ouvre la fiche du joueur signalé.</p>`;
    $('#contenu').querySelectorAll('[data-statut]').forEach((b) => (b.onclick = () => afficher.signalements(b.dataset.statut)));
    const traiter = async (id, st) => { const decision = prompt('Décision (facultatif) :') ?? ''; await api('/signalements/' + id, { methode: 'POST', corps: { statut: st, decision } }); afficher.signalements(statut); majBadge(); };
    $('#contenu').querySelectorAll('[data-traiter]').forEach((b) => (b.onclick = () => traiter(b.dataset.traiter, 'traite')));
    $('#contenu').querySelectorAll('[data-rejeter]').forEach((b) => (b.onclick = () => traiter(b.dataset.rejeter, 'rejete')));
    lierJoueurs();
  },

  async pilotage() {
    const r = await api('/reglages');
    const champs = (cle, libelles) => Object.entries(libelles).map(([k, t]) => `<label class="ligne"><span style="min-width:230px">${t}</span><input type="number" data-cle="${cle}" data-champ="${k}" value="${r[cle][k]}" style="width:110px"></label>`).join('');
    $('#contenu').innerHTML = `<h2>Pilotage</h2>
      <p class="muted">Ces réglages s'appliquent tout de suite, sans mise à jour du jeu. Chaque changement est noté dans le Journal.</p>
      <div class="carte"><h3 style="margin-top:0">Annonce à tous les joueurs</h3>
        <div class="ligne"><input id="annonce" value="${esc(r.annonce.texte)}" placeholder="Ex. Tournoi samedi à 20 h !" style="flex:1;min-width:260px"><label><input type="checkbox" id="annonceActive" ${r.annonce.active ? 'checked' : ''}> affichée</label><button class="btn principal" id="btnAnnonce">Enregistrer</button></div>
        <h3>Maintenance</h3>
        <div class="ligne"><input id="maint" value="${esc(r.maintenance.message)}" style="flex:1;min-width:260px"><label><input type="checkbox" id="maintActive" ${r.maintenance.active ? 'checked' : ''}> <span class="ko">jeu fermé</span></label><button class="btn" id="btnMaint">Enregistrer</button></div>
        <h3>Cadeau de fondateur</h3>
        <div class="ligne"><label><input type="checkbox" id="fondateurActif" ${r.cadeauFondateur && r.cadeauFondateur.active !== false && r.cadeauFondateur.actif ? 'checked' : ''}> distribuer le dos « Les Fondateurs » aux joueurs qui avaient des pièces d'essai</label><button class="btn" id="btnFondateur">Enregistrer</button></div>
        <h3>Version minimale de l'application</h3>
        <div class="ligne"><input id="version" value="${esc(r.versionMin)}" style="width:110px"><button class="btn" id="btnVersion">Enregistrer</button><span class="muted">Les versions plus anciennes devront se mettre à jour.</span></div>
      </div>
      <div class="carte"><h3 style="margin-top:0">Gains (tables gratuites)</h3>${champs('gains', { bienvenue: 'Cadeau de bienvenue', manche: 'Par manche survécue', katapss: 'Katapss', victoire: 'Victoire', deuxieme: '2e place' })}<button class="btn principal" data-enregistrer="gains">Enregistrer les gains</button>
        <h3>Bonus du jour</h3>${champs('bonusJour', { depart: 'Premier jour', pas: 'En plus chaque jour', plafond: 'Plafond' })}<button class="btn principal" data-enregistrer="bonusJour">Enregistrer le bonus</button>
        <h3>Parcours de saison (XP)</h3>${champs('parcours', { xpPartie: 'Par partie entre joueurs', xpManche: 'Par manche survécue', xpVictoire: 'Victoire', xpPalier: 'XP par palier', paliers: 'Nombre de paliers (10 à 30)' })}<button class="btn principal" data-enregistrer="parcours">Enregistrer le parcours</button>
        <h3>Remise à flot</h3>${champs('remiseAFlot', { seuil: 'Si le solde passe sous', niveau: 'Remonter à' })}<button class="btn principal" data-enregistrer="remiseAFlot">Enregistrer</button></div>
      <div class="carte"><h3 style="margin-top:0">Tables à mise</h3>${champs('tables', { bronze: 'Bronze', argent: 'Argent', or: 'Or', diamant: 'Diamant' })}<button class="btn principal" data-enregistrer="tables">Enregistrer les mises</button>
        <h3>Partage du pot (en %, total 100)</h3>${champs('pot', { vainqueur: 'Vainqueur', deuxieme: '2e', troisieme: '3e', maison: 'Maison (pièces détruites)' })}<button class="btn principal" data-enregistrer="pot">Enregistrer le partage</button></div>
      <div class="carte"><h3 style="margin-top:0">Messages du chat en partie</h3>
        <p class="muted">Un message par ligne (émoji ou courte phrase, 40 caractères au plus, 40 messages au plus). Les joueurs ne peuvent envoyer que ces messages, dans cet ordre.</p>
        <textarea id="messagesRapides" rows="8" style="width:100%;max-width:520px;font-size:16px">${esc((r.messagesRapides || []).join('\n'))}</textarea>
        <div class="ligne"><button class="btn principal" id="btnMessages">Enregistrer les messages</button></div></div>
      <div class="carte"><h3 style="margin-top:0">Cadeau à tous les joueurs</h3>
        <div class="ligne"><input id="cadeauMontant" type="number" min="1" placeholder="Pièces" style="width:110px"><input id="cadeauMotif" placeholder="Motif (ex. excuses pour la panne)" style="flex:1;min-width:240px"><button class="btn" id="btnCadeau">Envoyer</button></div></div>`;
    const ecrire = async (cle, valeur) => { try { await api('/reglages/' + cle, { methode: 'PUT', corps: { valeur } }); message('Enregistré.'); } catch (e) { message(e.message); } };
    $('#contenu').querySelectorAll('[data-enregistrer]').forEach((b) => (b.onclick = () => {
      const cle = b.dataset.enregistrer, v = {};
      $('#contenu').querySelectorAll(`[data-cle="${cle}"]`).forEach((i) => (v[i.dataset.champ] = Number(i.value)));
      ecrire(cle, v);
    }));
    $('#btnAnnonce').onclick = () => ecrire('annonce', { texte: $('#annonce').value, active: $('#annonceActive').checked });
    $('#btnMaint').onclick = () => { if (!$('#maintActive').checked || confirm('Fermer le jeu pour maintenance ?')) ecrire('maintenance', { message: $('#maint').value, active: $('#maintActive').checked }); };
    $('#btnMessages').onclick = () => ecrire('messagesRapides', $('#messagesRapides').value.split('\n'));
    $('#btnFondateur').onclick = () => ecrire('cadeauFondateur', { actif: $('#fondateurActif').checked });
    $('#btnVersion').onclick = () => ecrire('versionMin', $('#version').value.trim());
    $('#btnCadeau').onclick = async () => {
      const montant = Number($('#cadeauMontant').value);
      if (!confirm(`Donner ${montant} pièces à tous les joueurs actifs ?`)) return;
      try { const r2 = await api('/cadeau', { methode: 'POST', corps: { montant, motif: $('#cadeauMotif').value } }); message(`Cadeau envoyé à ${nb(r2.joueurs)} joueurs.`); } catch (e) { message(e.message); }
    };
  },

  async journal() {
    const l = await api('/journal');
    $('#contenu').innerHTML = `<h2>Journal</h2><p class="muted">Toutes les actions faites depuis ce tableau de bord.</p>
      <div class="carte"><table><tr><th>Date</th><th>Action</th><th>Cible</th><th>Détails</th></tr>${l.map((j) => `<tr><td>${date(j.cree_le)}</td><td>${esc(j.action)}</td><td>${j.cible && j.cible.startsWith("c_") ? `<button class="lien" data-joueur="${esc(j.cible)}">${esc(j.cible)}</button>` : esc(j.cible || '')}</td><td class="muted">${esc(JSON.stringify(j.details || ''))}</td></tr>`).join('') || '<tr><td class="muted">Rien pour l\'instant.</td></tr>'}</table></div>`;
    lierJoueurs();
  },
};
function lierJoueurs() { $('#contenu').querySelectorAll('[data-joueur]').forEach((b) => (b.onclick = () => aller('fiche', b.dataset.joueur))); }

if (jeton) demarrer(); else afficherConnexion();
</script>
</body>
</html>
