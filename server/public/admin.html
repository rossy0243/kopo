<style>
:root { --fond: #0d1d31; --fond-2: #142a45; --fond-3: #1b3556; --menu: #0a1728; --ligne: rgba(226,176,74,.22); --ligne2: rgba(255,255,255,.07); --laiton: #e2b04a; --encre: #f4ecd8; --muted: #93a7be; --rouge: #e0584f; --vert: #5fc27a; --bleu: #7fb2e5; --violet: #b49cf0; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--fond); color: var(--encre); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
.logo { font: 400 28px/1 "Bebas Neue", Impact, sans-serif; letter-spacing: 3px; color: var(--laiton); display: flex; align-items: center; gap: .35em; }
.logo img { width: 1.05em; height: 1.05em; border-radius: 22%; }
.logo small { display: block; font: 11px system-ui, sans-serif; letter-spacing: 1px; color: var(--muted); }
/* Mise en page : menu à gauche, contenu à droite ; sur téléphone, barre en haut et barre d'onglets en bas */
#app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; }
#menu { background: var(--menu); border-right: 1px solid var(--ligne); padding: 16px 10px 24px; position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; }
#menu .logo { padding: 2px 8px 14px; }
.grp { font-size: 10.5px; letter-spacing: 1.6px; text-transform: uppercase; color: #6f86a1; margin: 14px 10px 4px; }
#nav button { width: 100%; background: none; border: 0; color: #c4d1e0; padding: 7px 10px; border-radius: 8px; font: inherit; font-size: 14px; cursor: pointer; display: flex; gap: 10px; align-items: center; text-align: left; }
#nav button:hover { background: rgba(255,255,255,.04); }
#nav button[aria-current="page"] { color: var(--laiton); background: var(--fond-3); box-shadow: inset 3px 0 0 var(--laiton); }
.badge { margin-left: auto; background: var(--rouge); color: #fff; border-radius: 9px; padding: 0 7px; font-size: 11.5px; line-height: 18px; }
.badge.ambre { background: #a77b1f; } .badge.vert { background: #2c6b44; }
#menu .bas { margin-top: auto; padding: 16px 8px 0; }
main { padding: 22px 28px 60px; min-width: 0; max-width: 1320px; width: 100%; }
#barreHaut { display: none; }
#ongletsBas { display: none; }
#voile { display: none; }
@media (max-width: 900px) {
  #app { display: block; }
  #menu { position: fixed; inset: 0 auto 0 0; width: 270px; z-index: 20; transform: translateX(-100%); transition: transform .2s; }
  #app.menu-ouvert #menu { transform: none; }
  #app.menu-ouvert #voile { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 19; }
  #barreHaut { display: flex; align-items: center; gap: 10px; padding: 10px 16px; position: sticky; top: 0; background: var(--fond); border-bottom: 1px solid var(--ligne2); z-index: 10; }
  #barreHaut .logo { font-size: 24px; }
  main { padding: 14px 16px 90px; }
  #ongletsBas { display: flex; position: fixed; left: 0; right: 0; bottom: 0; background: var(--menu); border-top: 1px solid var(--ligne); z-index: 10; padding: 6px 0 calc(8px + env(safe-area-inset-bottom)); }
  #ongletsBas button { flex: 1; background: none; border: 0; color: var(--muted); font: 11px system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; gap: 2px; position: relative; padding: 2px 0; cursor: pointer; }
  #ongletsBas button[aria-current="page"] { color: var(--laiton); }
  #ongletsBas .ico-k { width: 22px; height: 22px; }
  #ongletsBas .badge { position: absolute; top: -2px; left: 54%; margin: 0; font-size: 10px; line-height: 15px; padding: 0 5px; }
}
h2 { font: 400 32px/1 "Bebas Neue", Impact, sans-serif; letter-spacing: 2px; color: var(--laiton); margin: 6px 0 16px; }
h3 { font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--laiton); margin: 22px 0 10px; }
.tete { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.tete h2 { margin: 0; }
.tete .sous { color: var(--muted); font-size: 13px; margin-top: 4px; }
.esp { flex: 1; }
.tuiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
.tuile { background: var(--fond-2); border: 1px solid var(--ligne2); border-radius: 12px; padding: 14px; }
.tuile b { display: block; font-size: 28px; font-variant-numeric: tabular-nums; }
.tuile small { color: var(--muted); }
.carte { background: var(--fond-2); border: 1px solid var(--ligne2); border-radius: 12px; padding: 16px; margin-bottom: 14px; min-width: 0; }
.carte > h3:first-child, .carte > .titre:first-child { margin-top: 0; }
.carte .titre { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; margin: 0 0 2px; }
.carte .titre .lien { margin-left: auto; font-weight: 400; font-size: 13px; text-decoration: none; }
.carte .s { color: var(--muted); font-size: 12.5px; margin-bottom: 10px; }
.defile { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.carte:has(> table) { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--ligne2); vertical-align: top; }
th { color: var(--muted); font-weight: 500; font-size: 13px; }
td.n, th.n { text-align: right; }
.btn { background: rgba(255,255,255,.07); border: 1px solid var(--ligne); color: var(--encre); border-radius: 8px; padding: 7px 12px; font: inherit; font-size: 14px; cursor: pointer; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.principal { background: var(--laiton); color: #1d1606; border-color: var(--laiton); font-weight: 600; }
.btn.danger { border-color: var(--rouge); color: #ffb4ae; }
.btn.icone { padding: 7px 10px; }
input, select, textarea { background: #0a1728; border: 1px solid var(--ligne); color: var(--encre); border-radius: 8px; padding: 8px 10px; font: inherit; max-width: 100%; }
input:focus, select:focus, textarea:focus { outline: 2px solid rgba(226,176,74,.45); outline-offset: 0; }
.ligne { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 8px 0; }
.muted { color: var(--muted); }
.ok { color: var(--vert); } .ko { color: #ff8a80; }
.lien { color: var(--laiton); cursor: pointer; text-decoration: underline; background: none; border: 0; font: inherit; padding: 0; }
#connexion { max-width: 360px; margin: 12vh auto; display: grid; gap: 12px; padding: 0 16px; }
#connexion .logo { font-size: 56px; text-align: center; justify-content: center; }
.graphe { width: 100%; height: 190px; display: block; }
.graphe text, .hm text { fill: var(--muted); font-size: 11px; }
.legende { display: flex; gap: 14px; font-size: 12.5px; color: var(--muted); flex-wrap: wrap; margin-bottom: 4px; }
.legende i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; vertical-align: -1px; margin-right: 5px; }
.message { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--fond-2); border: 1px solid var(--laiton); padding: 10px 16px; border-radius: 10px; z-index: 40; max-width: calc(100vw - 32px); }
@media (max-width: 900px) { .message { bottom: 84px; } }
.ico-k { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.ico-k .acc { fill: var(--rouge); stroke: none; }
.statut-banni, .statut-suspendu { color: #ff8a80; }

/* Tableau de bord */
.seg { display: inline-flex; background: var(--menu); border: 1px solid var(--ligne); border-radius: 9px; padding: 3px; }
.seg button { background: none; border: 0; color: var(--muted); font: inherit; font-size: 13.5px; padding: 5px 12px; border-radius: 6px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--fond-3); color: var(--encre); }
.alertes { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.al { display: flex; align-items: center; gap: 8px; background: var(--fond-2); border: 1px solid var(--ligne2); border-left: 3px solid var(--rouge); border-radius: 8px; padding: 8px 12px; font-size: 13.5px; }
.al.ambre { border-left-color: var(--laiton); } .al.vert { border-left-color: var(--vert); } .al.bleu { border-left-color: var(--bleu); }
.al b { font-size: 15px; }
.al .lien { text-decoration: none; margin-left: 4px; }
.kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; margin-bottom: 14px; }
@media (max-width: 1250px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 560px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } }
.kpi { background: var(--fond-2); border: 1px solid var(--ligne2); border-radius: 12px; padding: 13px 14px 10px; min-width: 0; }
.kpi .t { color: var(--muted); font-size: 12.5px; display: flex; align-items: center; gap: 6px; }
.kpi .v { font-size: 26px; font-weight: 650; margin: 4px 0 2px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi .v small { font-size: 14px; color: var(--muted); font-weight: 400; }
.kpi svg { display: block; width: 100%; height: 30px; margin-top: 6px; }
.d { font-size: 12.5px; } .d.haut { color: var(--vert); } .d.bas { color: var(--rouge); } .d .m, .d.neutre { color: var(--muted); }
.direct { width: 8px; height: 8px; border-radius: 50%; background: var(--vert); box-shadow: 0 0 0 3px rgba(95,194,122,.2); }
.grille { display: grid; gap: 14px; margin-bottom: 14px; }
.grille > .carte { margin-bottom: 0; }
.g21 { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); } .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media (max-width: 1100px) { .g21, .g3 { grid-template-columns: minmax(0, 1fr); } }
.ret { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ret > div { background: #0f2239; border-radius: 10px; padding: 10px; }
.ret b { font-size: 22px; display: block; }
.jauge { height: 6px; background: rgba(255,255,255,.08); border-radius: 3px; margin: 6px 0 4px; position: relative; }
.jauge span { position: absolute; inset: 0 auto 0 0; border-radius: 3px; background: var(--vert); }
.jauge em { position: absolute; top: -3px; width: 2px; height: 12px; background: var(--encre); opacity: .6; }
.liste td { padding: 6px 0; } .liste td:last-child { text-align: right; } .liste tr:last-child td { border: 0; }
.mini { display: inline-block; height: 8px; border-radius: 4px; background: var(--laiton); vertical-align: middle; margin-right: 8px; }
.nouv { font-size: 10px; letter-spacing: .5px; text-transform: uppercase; color: #0d1d31; background: var(--bleu); border-radius: 4px; padding: 1px 5px; font-weight: 700; }

/* Réglages */
.recherche { flex: 0 1 340px; min-width: 200px; }
.onglets { display: flex; gap: 2px; border-bottom: 1px solid var(--ligne); margin-bottom: 16px; overflow-x: auto; scrollbar-width: none; }
.onglets button { background: none; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; color: var(--muted); font: inherit; font-size: 14px; padding: 9px 12px; cursor: pointer; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
.onglets button[aria-selected="true"] { color: var(--laiton); border-color: var(--laiton); }
.onglets .pt { width: 7px; height: 7px; border-radius: 50%; background: var(--laiton); }
.reg-grille { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; align-items: start; }
@media (max-width: 1100px) { .reg-grille { grid-template-columns: minmax(0, 1fr); } }
.champ { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 14px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--ligne2); }
.champ:last-child { border-bottom: 0; }
.champ .l { font-weight: 500; }
.champ .l small { display: block; color: var(--muted); font-weight: 400; font-size: 12.5px; margin-top: 1px; }
.champ .def { color: #7d93ab; }
.champ .saisie { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
.champ.large { grid-template-columns: minmax(0, 1fr); }
.champ.large .saisie { justify-content: flex-start; }
.champ.large .saisie > input, .champ.large .saisie > textarea { flex: 1; }
.champ .unite { display: flex; align-items: center; background: #0a1728; border: 1px solid var(--ligne); border-radius: 8px; overflow: hidden; }
.champ .unite input { border: 0; width: 92px; text-align: right; background: none; }
.champ .unite em { font-style: normal; color: var(--muted); padding: 0 10px 0 0; font-size: 13px; white-space: nowrap; }
.champ.modifie .unite, .champ.modifie input:not([type]), .champ.modifie select, .champ.modifie textarea, .champ.modifie input[type="datetime-local"] { border-color: var(--laiton); box-shadow: 0 0 0 2px rgba(226,176,74,.18); }
.champ .marque { width: 8px; height: 8px; border-radius: 50%; background: transparent; flex: none; }
.champ.modifie .marque { background: var(--laiton); }
.champ .raz { color: var(--muted); font-size: 12.5px; }
.champ .erreur { grid-column: 1 / -1; color: #ff8a80; font-size: 12.5px; }
@media (max-width: 600px) { .champ { grid-template-columns: minmax(0, 1fr); } .champ .saisie { justify-content: flex-start; } }
.bascule { position: relative; width: 42px; height: 24px; flex: none; }
.bascule input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; z-index: 1; }
.bascule span { position: absolute; inset: 0; border-radius: 12px; background: #2a4466; transition: background .15s; }
.bascule span::after { content: ''; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #c8d3e0; transition: left .15s; }
.bascule input:checked + span { background: var(--vert); }
.bascule input:checked + span::after { left: 21px; background: #fff; }
.bascule input:focus-visible + span { outline: 2px solid var(--laiton); outline-offset: 2px; }
.champ.modifie .bascule span { box-shadow: 0 0 0 2px var(--laiton); }
.note { background: rgba(127,178,229,.08); border: 1px solid rgba(127,178,229,.25); border-radius: 9px; padding: 10px 12px; font-size: 13px; color: #c3d5e8; }
.cote .ligne-v { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--ligne2); font-variant-numeric: tabular-nums; }
.cote .ligne-v:last-child { border: 0; }
#barreEnregistrer { position: fixed; left: 236px; right: 0; bottom: 0; background: var(--menu); border-top: 1px solid var(--laiton); padding: 12px 28px; display: flex; align-items: center; gap: 12px; z-index: 15; flex-wrap: wrap; }
#barreEnregistrer .pt { width: 10px; height: 10px; border-radius: 50%; background: var(--laiton); }
@media (max-width: 900px) { #barreEnregistrer { left: 0; bottom: calc(58px + env(safe-area-inset-bottom)); padding: 10px 16px; } }
.fenetre-fond { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 30; display: grid; place-items: center; padding: 16px; }
.fenetre { background: var(--fond-2); border: 1px solid var(--laiton); border-radius: 14px; padding: 18px; width: min(560px, 100%); max-height: 85vh; overflow: auto; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
.fenetre h3 { margin-top: 0; }
.avant { color: var(--muted); text-decoration: line-through; }
.diff td { font-size: 13.5px; }
.journal-diff { font-size: 12.5px; color: var(--muted); }
.journal-diff b { color: var(--encre); font-weight: 500; }
</style>
</head>

<script>
'use strict';
const $ = (s) => document.querySelector(s);
const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nb = (x) => (x ?? 0).toLocaleString('fr-FR');
const date = (d) => d ? new Date(d).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' }) : '—';
const dateKin = (d) => d ? new Date(d).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short', timeZone: 'Africa/Kinshasa' }) : '—';
const MOTIFS = { bienvenue: 'Bienvenue', bonus_jour: 'Bonus du jour', manche: 'Manches survécues', katapss: 'Katapss', victoire: 'Victoires', deuxieme: '2e places', remise_a_flot: 'Remise à flot', admin: 'Corrections admin', cadeau: 'Cadeaux', mise: 'Mises', pot: 'Pots', saison: 'Récompenses de saison', parcours: 'Parcours de saison', boutique: 'Boutique', parrainage: 'Parrainage (parrains)', parrainage_filleul: 'Parrainage (filleuls)', mission: 'Missions du jour', defi: 'Défis de la semaine', bienvenue7: 'Bienvenue 7 jours', mise_bande: 'Mises de Bande', pot_bande: 'Pots de Bande (Chefs)', mise_rendue_bande: 'Mises rendues (2e de Bande)', remboursement_bande: 'Mises de Bande remboursées', achat_pieces: 'Bouquets de pièces (achats)', fleuve: 'Le Fleuve (étoiles et villes)' };
const DIV = { bois: 'Bois', bronze: 'Bronze', argent: 'Argent', or: 'Or', diamant: 'Diamant', legende: 'Légende' };
// Bouquets de pièces (argent réel) : les prix du jeu, et un bouquet livré à la main tant que le mobile money n'est pas branché.
async function bouquetsAdmin() {
  const B = await api('/bouquets');
  $('#bouquets').innerHTML = `<div class="carte"><table><tr><th>Bouquet</th><th class="n">Prix</th><th class="n">Pièces</th><th class="n">dont bonus</th></tr>
      ${B.bouquets.map((b) => `<tr><td>${esc(b.nom)}</td><td class="n">${nb(b.francs)} FC</td><td class="n">${nb(b.pieces)}</td><td class="n">${b.bonus ? `+${nb(b.bonus)} <span class="muted">(${b.bonusPct} %)</span>` : '<span class="muted">—</span>'}</td></tr>`).join('')}</table>
      <p class="muted" style="margin:8px 0 0">Même taux que les stickers : 200 pièces ≈ 500 FC. Plus le bouquet est gros, plus le bonus monte. Les joueurs voient ces bouquets dans « Acheter des pièces » ; le paiement mobile money n'est pas encore branché (« Bientôt »).</p></div>
    <div class="carte"><b>Livrer un bouquet</b> <span class="muted">(paiement mobile money reçu à la main)</span>
      <div class="ligne"><input id="bqJoueur" data-joueurs autocomplete="off" placeholder="Pseudo#1234" style="width:180px"><select id="bqQuoi">${B.bouquets.map((b) => `<option value="${b.id}">${esc(b.nom)} · ${nb(b.francs)} FC → ${nb(b.pieces)} pièces</option>`).join('')}</select>
        <input id="bqRef" placeholder="Référence (ex. n° de transaction)" style="flex:1;min-width:200px"><button class="btn principal" id="bqLivrer">Livrer</button></div>
      <p class="muted" style="margin:6px 0 0">Le joueur reçoit les pièces et une notification « Merci ! Ton bouquet est arrivé ». Noté au Journal.</p></div>
    <div class="carte"><table><tr><th>Date</th><th>Joueur</th><th class="n">Pièces</th><th>Référence</th></tr>
      ${lignes('bqLivraisons', B.livraisons, (l) => `<tr><td>${date(l.cree_le)}</td><td><button class="lien" data-joueur="${esc(l.compte)}">${esc(l.pseudo)}#${esc(l.numero)}</button></td><td class="n">${nb(l.pieces)}</td><td>${esc(l.ref || '')}</td></tr>`, { par: 10, colonnes: 4, vide: '<tr><td class="muted" colspan="4">Aucun bouquet livré pour l\'instant.</td></tr>' })}</table></div>`;
  $('#bqLivrer').onclick = async () => {
    const b = B.bouquets[Number($('#bqQuoi').value)], j = $('#bqJoueur').value.trim();
    if (!/#\d{4}$/.test(j)) return message('Écris le joueur sous la forme Pseudo#1234.');
    if (!confirm(`Livrer le bouquet « ${b.nom} » (${nb(b.pieces)} pièces) à ${j} ? Fais-le seulement si le paiement de ${nb(b.francs)} FC est bien reçu.`)) return;
    try { const r = await api('/bouquets/livrer', { methode: 'POST', corps: { joueur: j, bouquet: b.id, message: $('#bqRef').value } }); message(`${nb(r.bouquet.pieces)} pièces livrées à ${r.joueur.nom}.`); aller('ventes'); } catch (e) { message(e.message); }
  };
}
// Abonnement Kopo+ (micro en salle, couronne dorée) : prix, abonnés, et un abonnement activé à la main (paiement reçu).
async function abonnementsAdmin() {
  const A = await api('/abonnements');
  $('#abonnements').innerHTML = `<div class="carte"><div class="ligne"><span><b>${nb(A.actifs)}</b> abonné${A.actifs > 1 ? 's' : ''} en cours</span><span class="muted">·</span><span><b>${nb(A.francs30j)} FC</b> encaissés sur 30 jours (${nb(A.activations30j)} activation${A.activations30j > 1 ? 's' : ''})</span><span class="muted">·</span><span><b>${nb(A.essais30j)}</b> essai${A.essais30j > 1 ? 's' : ''} gratuit${A.essais30j > 1 ? 's' : ''} de ${A.essaiJours} jours sur 30 jours</span></div>
      <table><tr><th>Formule</th><th class="n">Prix</th><th class="n">Durée</th></tr>${A.formules.map((f) => `<tr><td>${esc(f.nom)}${f.note ? ` <span class="muted">(${esc(f.note)})</span>` : ''}</td><td class="n">${nb(f.francs)} FC</td><td class="n">${nb(f.jours)} jours</td></tr>`).join('')}</table>
      <p class="muted" style="margin:8px 0 0">Kopo+ donne le micro en salle (seuls les abonnés parlent et s'entendent), la couronne dorée et la voie Kopo+ du parcours. <span id="abLivekit">${A.micro ? 'Serveur vocal LiveKit : vérification…' : '<b>Micro éteint</b> : LIVEKIT_URL, LIVEKIT_API_KEY et LIVEKIT_API_SECRET absents sur Render.'}</span> Paiement mobile money pas encore branché.</p></div>
    <div class="carte"><b>Activer un abonnement</b> <span class="muted">(paiement mobile money reçu à la main)</span>
      <div class="ligne"><input id="abJoueur" data-joueurs autocomplete="off" placeholder="Pseudo#1234" style="width:180px"><select id="abQuoi">${A.formules.map((f) => `<option value="${esc(f.id)}">${esc(f.nom)} · ${nb(f.francs)} FC</option>`).join('')}</select>
      <input id="abRef" placeholder="Référence du paiement" style="width:200px"><button class="btn" id="abActiver">Activer</button></div>
      <p class="muted" style="margin:6px 0 0">S'il reste des jours, la nouvelle période s'ajoute à la fin. Le joueur reçoit une notification ; la couronne apparaît tout de suite à sa table. Noté au Journal.</p></div>
    <div class="carte"><b>Offrir ou prolonger Kopo+</b> <span class="muted">(gratuit : remerciement, excuses après une panne, cadeau de lancement…)</span>

  if (r.status === 401 && chemin !== '/connexion') { deconnexion(); throw new Error('Session expirée.'); }

// --- Graphe en lignes (séries sur 30 jours)
function graphe(donnees, series) {
  const L = 900, H = 180, g = 30, b = 22;
  const max = Math.max(1, ...donnees.flatMap((d) => series.map((s) => d[s.cle] || 0)));
  const x = (i) => g + (i * (L - g - 8)) / Math.max(1, donnees.length - 1);
  const y = (v) => H - b - (v / max) * (H - b - 10);
  const lignes = series.map((s) => `<polyline fill="none" stroke="${s.couleur}" stroke-width="2.2" stroke-linejoin="round" points="${donnees.map((d, i) => x(i) + ',' + y(d[s.cle] || 0)).join(' ')}"><title>${esc(s.nom)}</title></polyline>`).join('');
  const reperes = [0, Math.round(max / 2), max].map((v) => `<line x1="${g}" x2="${L}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(255,255,255,.07)"/><text x="${g - 4}" y="${y(v) + 4}" text-anchor="end">${nb(v)}</text>`).join('');
  const jours = donnees.map((d, i) => (i % 7 === 0 || (i === donnees.length - 1 && i % 7 >= 3)) ? `<text x="${x(i)}" y="${H - 4}" text-anchor="middle">${new Date(d.jour).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' })}</text>` : '').join('');
  return `<div class="legende">${series.map((s) => `<span><i style="background:${s.couleur}"></i>${esc(s.nom)}</span>`).join('')}</div>
    <svg class="graphe" viewBox="0 0 ${L} ${H}" preserveAspectRatio="none" role="img" aria-label="${esc(series.map((s) => s.nom).join(', '))} sur 30 jours">${reperes}${lignes}${jours}</svg>`;
}
// Longues listes : seules les premières lignes sont affichées, « Voir plus » en dévoile d'autres.
// Le serveur plafonne déjà chaque liste ; ce qui est déplié reste déplié pendant le rafraîchissement de « En direct ».
const deplies = {};
function lignes(cle, items, rendu, { par = 10, colonnes = 1, vide = '' } = {}) {
  if (!items.length) return vide;
  const n = Math.max(par, deplies[cle] || 0);
  return items.map((x, i) => rendu(x, i).replace(/^<tr/, i < n ? '<tr' : '<tr hidden')).join('')
    + (items.length > n ? `<tr class="plus"><td colspan="${colonnes}"><button class="lien" data-plus="${cle}" data-par="${par}">Voir plus (${items.length - n} de plus)</button></td></tr>` : '');
}
$('#contenu').addEventListener('click', (e) => {

  caches.slice(0, par).forEach((l) => (l.hidden = false));
  deplies[b.dataset.plus] = Math.max(par, deplies[b.dataset.plus] || 0) + par;
  const reste = caches.length - par;
  if (reste > 0) b.textContent = `Voir plus (${reste} de plus)`; else tr.remove();
});

  async ligue() {
    const L = await api('/ligue');
    const s = L.saison, c = L.reglages;
    const reste = s ? Math.max(0, new Date(s.fin) - Date.now()) : 0;
    const jours = Math.floor(reste / 864e5), heures = Math.floor((reste % 864e5) / 36e5);
    const champs = (groupe, libelles) => Object.entries(libelles).map(([k, t]) => `<label class="ligne"><span style="min-width:230px">${t}</span><input type="number" data-ligue="${groupe || ''}" data-champ="${k}" value="${groupe ? c[groupe][k] : c[k]}" style="width:110px"></label>`).join('');
    const max = Math.max(1, ...L.parDivision.map((d) => d.joueurs));
    const finLocale = s ? new Date(new Date(s.fin).getTime() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 16) : '';
    $('#contenu').innerHTML = `<h2>Ligue et saisons</h2>
      ${s ? `<div class="tuiles">${tuile(`<span style="font-size:20px">${esc(s.titre)}</span>`, 'saison en cours', 'du ' + date(s.debut) + ' au ' + date(s.fin))}${tuile(jours + ' j ' + heures + ' h', 'avant la fin')}${tuile(nb(L.joueurs), 'joueurs classés')}${tuile(nb(L.activite.parties_7j), 'parties classées', 'sur 7 jours')}${tuile(nb(L.activite.joueurs_7j), 'joueurs en ligue', 'sur 7 jours')}</div>` : '<p class="ko">Aucune saison en cours.</p>'}
      <h3>Répartition par division</h3>
      <div class="carte"><table>${L.parDivision.map((d) => `<tr><td style="width:110px">${esc(d.nom)}</td><td><div style="background:var(--laiton);height:10px;border-radius:5px;width:${Math.round((100 * d.joueurs) / max)}%;min-width:${d.joueurs ? 3 : 0}px"></div></td><td class="n" style="width:80px">${nb(d.joueurs)}</td><td class="n muted" style="width:120px">dès ${nb(c.seuils[d.division])} pts</td></tr>`).join('')}</table></div>
      <h3>Classement mondial</h3>
      <div class="carte"><table><tr><th class="n">Rang</th><th>Joueur</th><th>Division</th><th class="n">Points</th><th class="n">Parties</th></tr>${lignes('top', L.top, (j) => `<tr><td class="n">${j.rang}</td><td><button class="lien" data-joueur="${esc(j.id)}">${esc(j.pseudo)}#${j.numero}</button></td><td>${esc(DIV[j.division] || j.division)}</td><td class="n">${nb(j.points)}</td><td class="n">${nb(j.parties)}</td></tr>`, { colonnes: 5, vide: '<tr><td colspan="5" class="muted">Personne n\'a encore joué de partie classée cette saison.</td></tr>' })}</table></div>
      ${s ? `<div class="carte"><h3 style="margin-top:0">Saison en cours</h3>
        <div class="ligne"><span style="min-width:120px">Nom</span><input id="sNom" value="${esc(s.nom)}" maxlength="40" style="min-width:220px"><span>Thème</span><input id="sTheme" value="${esc(s.theme || '')}" maxlength="40"></div>
        <div class="ligne"><span style="min-width:120px">Fin</span><input id="sFin" type="datetime-local" value="${finLocale}"><button class="btn principal" id="btnSaison">Enregistrer</button></div>
        <h3>Prochaine saison</h3>
        <p class="muted">Laisse vide pour un nom de ville choisi automatiquement (Kinshasa, Lubumbashi, Abidjan…).</p>
        <div class="ligne"><span style="min-width:120px">Nom</span><input id="pNom" value="${esc(L.prochaine.nom)}" maxlength="40" placeholder="Ex. Fête de l'indépendance" style="min-width:220px"><span>Thème</span><input id="pTheme" value="${esc(L.prochaine.theme)}" maxlength="40"><button class="btn" id="btnProchaine">Enregistrer</button></div>
        <h3>Clôturer maintenant</h3>
        <p class="muted">Verse tout de suite les récompenses, fait redescendre chacun et ouvre la saison suivante. Irréversible : à réserver aux cas exceptionnels.</p>
        <button class="btn danger" id="btnCloturer">Clôturer la saison ${s.numero}</button></div>` : ''}
      <div class="carte"><h3 style="margin-top:0">Points de ligue par partie</h3>
        ${champs('points', { premier: '1re place', deuxieme: '2e place', troisieme: '3e place (5 joueurs et plus)', avantDernier: 'Avant-dernier (6 joueurs et plus)', dernier: 'Dernier (4 joueurs et plus)', abandon: 'Abandon volontaire' })}
        <p class="muted">Moins de 5 joueurs : les gains sont réduits en proportion. Coupure réseau sans retour : ni gain ni perte.</p>
        <h3>Seuils des divisions (points)</h3>${champs('seuils', DIV)}
        <h3>Pièces de fin de saison (division atteinte)</h3>${champs('recompenses', DIV)}
        <h3>Divisions perdues au début de la saison suivante</h3>${champs('descente', DIV)}
        <h3>Règles</h3>${champs(null, { protection: 'Parties protégées après une montée', joueursMin: 'Joueurs humains minimum', dureeJours: 'Durée d\'une saison (jours)' })}
        <button class="btn principal" id="btnReglesLigue">Enregistrer les règles de la ligue</button></div>
      <h3>Saisons passées</h3>
      <div class="carte"><table><tr><th>Saison</th><th>Dates</th><th>Champion</th><th class="n">Joueurs récompensés</th><th class="n">Pièces versées</th></tr>${lignes('passees', L.passees, (p) => `<tr><td>Saison ${p.numero} : ${esc(p.nom)}</td><td>${date(p.debut)} → ${date(p.fin)}</td><td>${esc(p.champion || '—')}</td><td class="n">${nb(p.joueurs)}</td><td class="n">${nb(p.pieces)}</td></tr>`, { par: 5, colonnes: 5, vide: '<tr><td colspan="5" class="muted">Aucune pour l\'instant.</td></tr>' })}</table></div>`;
    lierJoueurs();
    if (s) {
      $('#btnSaison').onclick = async () => { try { await api('/ligue/saison', { methode: 'PUT', corps: { nom: $('#sNom').value, theme: $('#sTheme').value, fin: new Date($('#sFin').value).toISOString() } }); message('Saison enregistrée.'); aller('ligue'); } catch (e) { message(e.message); } };
      $('#btnProchaine').onclick = async () => { try { await api('/reglages/prochaineSaison', { methode: 'PUT', corps: { valeur: { nom: $('#pNom').value, theme: $('#pTheme').value } } }); message('Enregistré.'); } catch (e) { message(e.message); } };
      $('#btnCloturer').onclick = async () => {
        if (prompt(`Clôturer la saison ${s.numero} maintenant ? Les récompenses seront versées. Écris CLOTURER pour confirmer.`) !== 'CLOTURER') return;
        try { const r = await api('/ligue/cloturer', { methode: 'POST', corps: { confirmation: 'CLOTURER' } }); message(`Saison ${r.cloturee} clôturée, saison ${r.ouverte} ouverte.`); aller('ligue'); } catch (e) { message(e.message); }
      };
    }
    $('#btnReglesLigue').onclick = async () => {
      const v = JSON.parse(JSON.stringify(c));
      $('#contenu').querySelectorAll('[data-ligue]').forEach((i) => { if (i.dataset.ligue) v[i.dataset.ligue][i.dataset.champ] = Number(i.value); else v[i.dataset.champ] = Number(i.value); });
      try { await api('/reglages/ligue', { methode: 'PUT', corps: { valeur: v } }); message('Règles de la ligue enregistrées.'); aller('ligue'); } catch (e) { message(e.message); }
    };
  },

      <div class="tuiles">${tuile(nb(B.matchJour.joueurs), 'Matchs du jour joués', 'aujourd\'hui')}${tuile(B.matchJour.moyenne + ' / 100', 'score moyen')}${tuile(nb(B.bandes.length), 'Bandes')}${tuile(nb(suspectes), 'Bandes à vérifier', 'même Chef 3 semaines, d\'autres misent sans jouer')}</div>

  },

  async joueurs(q = '', filtre = 'tous') {
    $('#contenu').innerHTML = `<h2>Joueurs</h2><div id="comptage"></div><div class="ligne"><input id="recherche" data-joueurs autocomplete="off" placeholder="Pseudo, Pseudo#1234, e-mail ou identifiant" value="${esc(q)}" style="min-width:300px"><select id="filtre">${[['tous', 'Tous les joueurs'], ['google', 'Connectés avec Google'], ['invite', 'Invités (non connectés)']].map(([v, t]) => `<option value="${v}"${v === filtre ? ' selected' : ''}>${t}</option>`).join('')}</select><button class="btn principal" id="btnRecherche">Chercher</button></div><div id="resultats"></div>`;
    const go = async () => {
      const r = await api('/joueurs?q=' + encodeURIComponent($('#recherche').value) + '&filtre=' + encodeURIComponent($('#filtre').value));
      const k = r.comptage, l = r.joueurs;
      const part = k.total ? Math.round((100 * k.google) / k.total) : 0;
      $('#comptage').innerHTML = `<div class="tuiles">${tuile(nb(k.total), 'joueurs au total')}${tuile(nb(k.google), 'connectés avec Google', part + ' % des joueurs')}${tuile(nb(k.invites), 'invités (non connectés)')}${tuile(nb(k.resultats) + (k.resultats >= k.plafond ? '+' : ''), 'dans cette recherche', k.resultats >= k.plafond ? 'les ' + k.plafond + ' plus récents' : '')}</div>`;
      $('#resultats').innerHTML = `<div class="carte"><table><tr><th>Joueur</th><th>E-mail Google</th><th class="n">Pièces</th><th>Statut</th><th>Inscrit</th><th>Vu</th></tr>${lignes('joueurs', l, (c) => `<tr><td><button class="lien" data-joueur="${esc(c.id)}">${esc(c.pseudo)}#${c.numero}</button>${c.lie ? '' : ' <span class="muted">(invité)</span>'}</td><td>${c.email ? esc(c.email) : `<span class="muted">${c.lie ? '—' : ''}</span>`}</td><td class="n">${nb(c.solde)}</td><td class="statut-${c.statut}">${esc(c.statut)}</td><td>${date(c.creeLe)}</td><td>${date(c.vuLe)}</td></tr>`, { par: 20, colonnes: 6, vide: '<tr><td colspan="6" class="muted">Aucun joueur.</td></tr>' })}</table></div>`;
      lierJoueurs();
    };
    $('#btnRecherche').onclick = go;
    $('#filtre').onchange = go;
    $('#recherche').addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
    await go();
  },

  // Stickers animés : on vend des utilisations (20, 50…). En attendant les paiements, l'admin les offre
  // à un joueur, à tous, ou à un groupe, avec un message qui dit pourquoi (montré au joueur).
  async stickers(joueur = '') {
    const S = await api('/stickers');
    const R = S.reglage, nomSt = Object.fromEntries(S.stickers.map((x) => [x.id, x.nom])), nomPack = Object.fromEntries(S.packs.map((p) => [p.id, p.nom]));
    const parSt = Object.fromEntries(S.parSticker.map((x) => [x.sticker, x]));
    const critere = Object.fromEntries(S.criteres.map((x) => [x.id, x]));
    const decrire = (c) => !c ? '—' : c.type === 'tous' ? 'Tous les joueurs' : c.type === 'joueur' ? esc(c.nom || c.id)
      : 'Groupe : ' + Object.entries(c.criteres || {}).map(([k, v]) => esc(k === 'pays' ? 'pays ' + v : (critere[k] ? critere[k].texte : k).replace(' N ', v === true ? ' ' : ` ${v} `).replace(/\s*\(.*\)/, ''))).join(' et ');
    const prix = (o) => `${nb(o.utilisations)} utilisations · ${nb(o.pieces)} pièces · ${nb(o.francs)} FC`;
    $('#contenu').innerHTML = `<h2>Stickers animés</h2>
      <div class="carte"><div class="ligne"><span>${R.actif ? '<b class="ok">Allumés</b> : les joueurs qui ont des utilisations peuvent envoyer leurs stickers.' : '<b class="ko">Éteints</b> : grisés pour tous les joueurs, rien ne s\'envoie. Les utilisations offertes sont gardées pour plus tard.'}</span>
        <span style="flex:1"></span><button class="btn ${R.actif ? 'danger' : 'principal'}" id="stInter">${R.actif ? 'Éteindre les stickers' : 'Allumer les stickers'}</button></div>
        <div class="ligne"><span>${R.vente ? '<b class="ok">Vente ouverte</b> : les joueurs peuvent acheter des utilisations en pièces' + (R.actif ? '.' : ', dès que les stickers seront allumés.') : '<b class="ko">Vente fermée</b> : les prix sont affichés, rien ne s\'achète.'}</span>
          <span style="flex:1"></span><button class="btn ${R.vente ? 'danger' : 'principal'}" id="stVente">${R.vente ? 'Fermer la vente' : 'Ouvrir la vente en pièces'}</button></div>
        <p class="muted" style="margin:0">Chaque envoi en partie décompte une utilisation ; à 0 le sticker se reverrouille. L'achat en argent réel attend le paiement mobile.</p></div>
      <h3>Cadeau de bienvenue</h3>
      <div class="carte"><p class="muted" style="margin:0 0 6px">Offert une seule fois à chaque joueur, nouveau ou déjà inscrit, la première fois qu'il ouvre ses stickers pendant qu'ils sont allumés. Une notification lui dit ce qu'il a reçu. ${nb(S.bienvenueJoueurs)} joueur${S.bienvenueJoueurs > 1 ? 's l\'ont' : ' l\'a'} reçu.</p>
        <div class="ligne" style="flex-wrap:wrap">${S.stickers.map((x) => `<label style="display:flex;gap:6px;align-items:center;min-width:150px"><input type="checkbox" data-bienvenue="${x.id}"${R.bienvenue.stickers.includes(x.id) ? ' checked' : ''}>${esc(x.nom)}</label>`).join('')}</div>
        <div class="ligne"><input id="stBvN" type="number" min="0" max="100" value="${R.bienvenue.utilisations}" style="width:80px"> <span class="muted">envois de chaque sticker coché (0 = pas de cadeau)</span><span style="flex:1"></span><button class="btn" id="stBienvenue">Enregistrer</button></div></div>
      <h3>Offrir des stickers</h3>
      <div class="carte">
        <div class="ligne"><b style="width:90px">À qui</b><select id="stCible"><option value="joueur">Un joueur</option><option value="tous">Tous les joueurs</option><option value="groupe">Un groupe de joueurs</option></select>
          <input id="stJoueur" data-joueurs autocomplete="off" placeholder="Pseudo#1234" value="${esc(joueur)}" style="min-width:200px"></div>
        <div id="stGroupe" hidden><p class="muted" style="margin:4px 0">Coche un ou plusieurs critères : le groupe, ce sont les joueurs qui les remplissent tous.</p>
          ${S.criteres.map((x) => `<div class="ligne" style="margin:4px 0"><label style="display:flex;gap:8px;align-items:center;min-width:330px"><input type="checkbox" data-critere="${x.id}">${esc(x.texte)}</label>${x.n ? `<input type="number" data-n="${x.id}" min="${x.n[0]}" max="${x.n[1]}" value="${{ anciennete: 30, nouveaux: 7, actifs: 7, absents: 14, parties: 10, parrains: 1 }[x.id] || x.n[0]}" style="width:90px"> <span class="muted">${x.id === 'parties' ? 'parties' : x.id === 'parrains' ? 'amis' : 'jours'}</span>` : x.pays ? `<input data-pays="${x.id}" value="CD" maxlength="2" style="width:60px">` : ''}</div>`).join('')}</div>
        <div class="ligne"><b style="width:90px">Quoi</b><select id="stQuoi">${S.packs.map((p) => `<option value="pack:${p.id}">Pack ${esc(p.nom)} (${p.stickers.length} sticker${p.stickers.length > 1 ? 's' : ''})</option>`).join('')}${S.stickers.map((x) => `<option value="sticker:${x.id}">${esc(x.nom)} (${esc(nomPack[x.pack])})</option>`).join('')}</select>
          <input id="stN" type="number" min="1" max="500" value="20" style="width:90px"> <span class="muted">utilisations de chaque sticker</span></div>
        <div class="ligne"><b style="width:90px">Pourquoi</b><textarea id="stMessage" rows="2" maxlength="200" placeholder="Message montré aux joueurs (obligatoire), ex. Merci d'être avec nous depuis le début !" style="flex:1;min-width:280px"></textarea></div>
        <p class="muted" id="stApercu" style="margin:6px 0"></p>
        <div class="ligne"><button class="btn" id="stCompter">Compter les joueurs</button><span id="stCompte" class="muted"></span><span style="flex:1"></span><button class="btn principal" id="stOffrir">Offrir</button></div>
      </div>
      <h3>En circulation</h3>
      <div class="carte"><table><tr><th>Sticker</th><th>Pack</th><th class="n">Joueurs qui en ont</th><th class="n">Utilisations restantes</th><th class="n">Envoyés</th></tr>
        ${S.stickers.map((x) => { const p = parSt[x.id] || {}; return `<tr><td>${esc(x.nom)}</td><td>${esc(nomPack[x.pack])}</td><td class="n">${nb(p.joueurs)}</td><td class="n">${nb(p.restants)}</td><td class="n">${nb(p.utilises)}</td></tr>`; }).join('')}</table></div>
      <h3>Offres</h3>
      <div class="carte"><table><tr><th>Un sticker</th><td>${R.offres.sticker.map(prix).join('<br>')}</td></tr>
        ${S.packs.map((p) => `<tr><th>Pack ${esc(p.nom)} (${p.stickers.length})</th><td>${S.offres.packs[p.id].length ? S.offres.packs[p.id].map(prix).join('<br>') : '<span class="muted">pas de pack d\'un seul sticker : il se vend à l\'unité</span>'}</td></tr>`).join('')}</table>
        <p class="muted" style="margin:8px 0 0">Un pack donne les utilisations à chacun de ses stickers, avec ${nb(R.remisePack)} % de moins que les stickers achetés un par un. Les pièces s'achètent en jeu ; le prix en francs congolais attend le paiement mobile.</p></div>
      <h3>Derniers cadeaux</h3>
      <div class="carte"><table><tr><th>Date</th><th>À qui</th><th>Quoi</th><th class="n">Joueurs</th><th>Message</th></tr>
        ${lignes('stCadeaux', S.cadeaux, (k) => `<tr><td>${date(k.cree_le)}</td><td>${decrire(k.cible)}</td><td>${nb(k.utilisations)} × ${k.stickers.map((x) => esc(nomSt[x] || x)).join(', ')}</td><td class="n">${nb(k.joueurs)}</td><td>${esc(k.message)}</td></tr>`, { par: 10, colonnes: 5, vide: '<tr><td class="muted" colspan="5">Aucun cadeau pour l\'instant.</td></tr>' })}</table></div>`;
    lierJoueurs();
    const cible = () => {
      const t = $('#stCible').value;
      if (t === 'joueur') return { type: 'joueur', joueur: $('#stJoueur').value.trim() };
      if (t === 'tous') return { type: 'tous' };
      const criteres = {};
      $('#contenu').querySelectorAll('[data-critere]').forEach((b) => {
        if (!b.checked) return;
        const k = b.dataset.critere, n = $(`[data-n="${k}"]`), p = $(`[data-pays="${k}"]`);
        criteres[k] = n ? Number(n.value) : p ? p.value.trim() : true;
      });
      return { type: 'groupe', criteres };
    };
    const quoi = () => { const [g, id] = $('#stQuoi').value.split(':'); return g === 'pack' ? { pack: id } : { sticker: id }; };
    const apercu = () => {
      $('#stJoueur').hidden = $('#stCible').value !== 'joueur';
      $('#stGroupe').hidden = $('#stCible').value !== 'groupe';
      const q = quoi(), n = Number($('#stN').value) || 0, m = $('#stMessage').value.trim();
      $('#stApercu').textContent = `Les joueurs verront : 🎁 ${m || '(ton message)'} Tu reçois ${n} utilisation${n > 1 ? 's' : ''} ${q.pack ? `du pack « ${nomPack[q.pack]} »` : `du sticker « ${nomSt[q.sticker]} »`}.`;
      $('#stCompte').textContent = '';
    };
    $('#contenu').querySelectorAll('#stCible, #stQuoi, #stN, #stMessage, #stJoueur, [data-critere], [data-n], [data-pays]').forEach((x) => (x.oninput = x.onchange = apercu));
    apercu();
    $('#stCompter').onclick = async () => { try { const r = await api('/stickers/compter', { methode: 'POST', corps: { cible: cible() } }); $('#stCompte').textContent = !r.joueurs ? 'Aucun joueur dans cette cible.' : r.joueurs === 1 ? '1 joueur recevra le cadeau.' : `${nb(r.joueurs)} joueurs recevront le cadeau.`; } catch (e) { message(e.message); } };
    $('#stOffrir').onclick = async () => {
      try {
        if ($('#stMessage').value.trim().length < 5) return message('Écris aux joueurs pourquoi tu leur offres ces stickers.');
        const k = await api('/stickers/compter', { methode: 'POST', corps: { cible: cible() } });
        if (!k.joueurs) return message('Aucun joueur dans cette cible.');
        if (!confirm(`Offrir ce cadeau à ${nb(k.joueurs)} joueur${k.joueurs > 1 ? 's' : ''} ? Il ne peut pas être annulé.`)) return;
        const r = await api('/stickers/offrir', { methode: 'POST', corps: { cible: cible(), ...quoi(), utilisations: Number($('#stN').value), message: $('#stMessage').value } });
        message(`Stickers offerts à ${nb(r.joueurs)} joueur${r.joueurs > 1 ? 's' : ''}.`); aller('stickers');
      } catch (e) { message(e.message); }
    };
    $('#stInter').onclick = async () => {
      if (!R.actif && !confirm('Allumer les stickers ? Les joueurs qui ont des utilisations pourront les envoyer en partie.')) return;
      try { await api('/reglages/stickers', { methode: 'PUT', corps: { valeur: { ...R, actif: !R.actif } } }); message(R.actif ? 'Stickers éteints.' : 'Stickers allumés.'); aller('stickers'); } catch (e) { message(e.message); }
    };
    $('#stBienvenue').onclick = async () => {
      const ids = [...$('#contenu').querySelectorAll('[data-bienvenue]:checked')].map((b) => b.dataset.bienvenue);
      try { await api('/reglages/stickers', { methode: 'PUT', corps: { valeur: { ...R, bienvenue: { stickers: ids, utilisations: Number($('#stBvN').value) || 0 } } } }); message('Cadeau de bienvenue enregistré.'); aller('stickers'); } catch (e) { message(e.message); }
    };
    $('#stVente').onclick = async () => {
      if (!R.vente && !confirm('Ouvrir la vente ? Les joueurs pourront acheter des utilisations de stickers avec leurs pièces.')) return;
      try { await api('/reglages/stickers', { methode: 'PUT', corps: { valeur: { ...R, vente: !R.vente } } }); message(R.vente ? 'Vente fermée.' : 'Vente ouverte.'); aller('stickers'); } catch (e) { message(e.message); }
    };
  },

  // Notifications push : abonnés, envoyer une annonce tout de suite ou à une date (heure de Kinshasa), annonces envoyées.
  async notifications() {
    const [r, reg] = await Promise.all([api('/push'), api('/reglages')]);
    let prog = (reg.pushProgrammes || []).map((x) => ({ ...x }));
    const pub = () => ($('#pushPays').value.trim() ? { pays: $('#pushPays').value.trim().toUpperCase() } : {});
    const corps = () => ({ titre: $('#pushTitre').value, texte: $('#pushTexte').value, public: pub() });
    const dessinerProg = () => {
      const l = prog.slice().sort((a, b) => (a.envoye ? 1 : 0) - (b.envoye ? 1 : 0) || a.quand.localeCompare(b.quand));
      $('#programmees').innerHTML = l.length ? `<div class="defile"><table><tr><th>Envoi (Kinshasa)</th><th>Titre</th><th>Texte</th><th>Public</th><th>État</th><th></th></tr>${l.map((x) => `<tr${x.envoye ? ' class="muted"' : ''}><td>${dateKin(x.quand)}</td><td>${esc(x.titre || 'Masano')}</td><td class="muted">${esc(x.texte)}</td><td>${esc(x.pays || 'Tous')}</td><td>${x.envoye ? esc(x.resultat || 'envoyée') : 'en attente'}</td><td>${x.envoye ? '' : `<button class="btn icone" data-annuler-prog="${esc(x.id)}" title="Annuler">✕</button>`}</td></tr>`).join('')}</table></div>`
        : '<p class="muted">Aucune notification programmée.</p>';
      $('#programmees').querySelectorAll('[data-annuler-prog]').forEach((b) => (b.onclick = async () => {
        if (!confirm('Annuler cette notification programmée ?')) return;
        const garde = prog.filter((x) => x.id !== b.dataset.annulerProg);
        try { const x = await api('/reglages/pushProgrammes', { methode: 'PUT', corps: { valeur: garde } }); prog = x.valeur; dessinerProg(); message('Notification annulée.'); } catch (e) { message(e.message); }
      }));
    };
    $('#contenu').innerHTML = `<h2>Notifications push</h2>
      ${r.actif ? '' : '<p class="ko">Notifications push éteintes : ajoute VAPID_PUBLIC, VAPID_PRIVE et VAPID_CONTACT dans Render (Environment), puis redéploie.</p>'}
      <div class="tuiles" style="margin-bottom:14px">${tuile(nb(r.joueurs), 'joueurs abonnés')}${tuile(nb(r.appareils), 'téléphones')}${tuile(nb(prog.filter((x) => !x.envoye).length), 'programmées')}</div>
      <div class="carte"><h3>Écrire une annonce</h3>
        <p class="muted">Elle arrive sur le téléphone des joueurs qui ont activé les notifications et n'ont pas coupé « Annonces de Masano », même la nuit : pense à l'heure. Une annonce toutes les 10 minutes au plus. Les meilleures heures se voient sur le Tableau de bord (Heures de jeu).</p>
        <div class="ligne"><input id="pushTitre" maxlength="60" placeholder="Titre (ex. Tournoi ce soir)" style="flex:1;min-width:220px"></div>
        <div class="ligne"><textarea id="pushTexte" maxlength="200" rows="3" placeholder="Texte (200 caractères au plus)" style="flex:1;min-width:220px;font-size:16px"></textarea></div>
        <div class="ligne"><label>Public <input id="pushPays" maxlength="2" placeholder="Pays (CD, CI…), vide = tous" style="width:220px"></label><button class="btn" id="btnPushCompter">Combien de joueurs ?</button><span id="pushCompte" class="muted"></span></div>
        <div class="ligne"><input id="pushEssai" data-joueurs autocomplete="off" placeholder="Ton identifiant (Pseudo#1234)" style="width:240px"><button class="btn" id="btnPushEssai">M'envoyer un essai</button></div>
        <div class="ligne"><button class="btn principal" id="btnPushEnvoyer">Envoyer maintenant</button><span class="muted">ou</span><input type="datetime-local" id="pushQuand" aria-label="Date d'envoi (heure de Kinshasa)"><button class="btn" id="btnPushProgrammer">Programmer</button><span class="muted">heure de Kinshasa</span></div></div>
      <div class="carte"><h3>Programmées</h3><div id="programmees"></div></div>
      <div class="carte"><h3>Annonces envoyées</h3><div class="defile"><table><tr><th>Date</th><th>Titre</th><th>Texte</th><th>Public</th><th class="n">Joueurs</th><th class="n">Reçues</th></tr>
        ${r.annonces.length ? r.annonces.map((a) => `<tr><td>${date(a.cree_le)}</td><td>${esc(a.titre)}</td><td class="muted">${esc(a.texte)}</td><td>${esc((a.public && a.public.pays) || 'Tous')}</td><td class="n">${nb(a.joueurs)}</td><td class="n">${nb(a.envoyees)}</td></tr>`).join('') : '<tr><td colspan="6" class="muted">Aucune annonce envoyée.</td></tr>'}</table></div></div>`;
    dessinerProg();
    $('#btnPushCompter').onclick = async () => { try { const x = await api('/push/compter', { methode: 'POST', corps: { public: pub() } }); $('#pushCompte').textContent = `${nb(x.joueurs)} joueurs (${nb(x.appareils)} téléphones)`; } catch (e) { message(e.message); } };
    $('#btnPushEssai').onclick = async () => {
      try { const x = await api('/push/annonce', { methode: 'POST', corps: { ...corps(), essai: $('#pushEssai').value } }); message(`Essai envoyé sur ${nb(x.envoyees)} téléphone(s).`); } catch (e) { message(e.message); }
    };
    $('#btnPushEnvoyer').onclick = async () => {
      if (!$('#pushTexte').value.trim()) return message('Écris le texte de l\'annonce.');
      try {
        const x = await api('/push/compter', { methode: 'POST', corps: { public: pub() } });
        if (!confirm(`Envoyer « ${$('#pushTitre').value || 'Masano'} » à ${x.joueurs} joueurs${pub().pays ? ' (' + pub().pays + ')' : ''} ? C'est immédiat.`)) return;
        const y = await api('/push/annonce', { methode: 'POST', corps: corps() });
        message(`Annonce envoyée : ${nb(y.envoyees)} téléphone(s) sur ${nb(y.appareils)}.`);
        afficher.notifications();
      } catch (e) { message(e.message); }
    };
    $('#btnPushProgrammer').onclick = async () => {
      if (!$('#pushTexte').value.trim()) return message('Écris le texte de l\'annonce.');
      const quand = $('#pushQuand').value;
      if (!quand) return message('Choisis la date et l\'heure d\'envoi.');
      if (new Date(quand + ':00+01:00') < new Date()) return message('Cette heure est déjà passée.');
      const nouvelle = { titre: $('#pushTitre').value, texte: $('#pushTexte').value, quand, pays: pub().pays || '' };
      try {
        const x = await api('/reglages/pushProgrammes', { methode: 'PUT', corps: { valeur: prog.concat([nouvelle]) } });
        prog = x.valeur; dessinerProg();
        $('#pushTitre').value = $('#pushTexte').value = $('#pushQuand').value = '';
        message('Notification programmée.');
      } catch (e) { message(e.message); }
    };
  },

  // Journal : les dernières actions du tableau de bord ; pour un réglage, ce qui a changé (avant → après).
  async journal(filtre = 'tout') {
    const l = await api('/journal');
    const TYPES = [['tout', 'Tout'], ['reglage', 'Réglages'], ['joueur', 'Joueurs et sanctions'], ['argent', 'Ventes et cadeaux'], ['autre', 'Autres']];
    const type = (a) => (a.startsWith('reglage:') ? 'reglage' : /sanction|joueur|objet|createur|signalement/.test(a) ? 'joueur' : /bouquet|abonnement|cadeau|pieces|kopo-plus|sticker/.test(a) ? 'argent' : 'autre');
    // Différences feuille à feuille entre l'ancienne et la nouvelle valeur d'un réglage.
    const diff = (av, ap, chemin = '', out = []) => {
      if (av && ap && typeof av === 'object' && typeof ap === 'object' && !Array.isArray(av) && !Array.isArray(ap)) {
        for (const k of new Set(Object.keys(av).concat(Object.keys(ap)))) diff(av[k], ap[k], chemin ? chemin + '.' + k : k, out);

    const court = (v) => { const t = v === undefined ? '—' : typeof v === 'string' ? v : JSON.stringify(v); return t.length > 60 ? t.slice(0, 57) + '…' : t; };
    const libelle = (action, chemin) => { const c = action.slice(8) + (chemin ? '.' + chemin : ''); const ch = CHAMPS.find((x) => x.c === c); return ch ? ch.l : c === 'pushProgrammes' ? 'Liste' : c; };

// --- Tableau de bord : petits dessins (courbe miniature, barres empilées, carte des heures)
function miniCourbe(vals, couleur) {
  if (!vals.length) return '<svg viewBox="0 0 100 30"></svg>';
  const max = Math.max(...vals), min = Math.min(...vals);
  const pts = vals.map((v, i) => `${((i * 100) / Math.max(1, vals.length - 1)).toFixed(1)},${(28 - ((v - min) / (max - min || 1)) * 24).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 100 30" preserveAspectRatio="none" aria-hidden="true"><polyline points="0,30 ${pts} 100,30" fill="${couleur}" fill-opacity=".13" stroke="none"/><polyline points="${pts}" fill="none" stroke="${couleur}" stroke-width="1.7" vector-effect="non-scaling-stroke"/></svg>`;
}
function barresEmpilees(donnees, piles) {
  const L = 420, H = 190, g = 44, b = 22, n = donnees.length;
  const tot = donnees.map((d) => piles.reduce((s, p) => s + (d[p.cle] || 0), 0));
  const brut = Math.max(1, ...tot), pas = Math.pow(10, Math.floor(Math.log10(brut))), max = Math.ceil(brut / pas) * pas;
  const w = (L - g) / n, y = (v) => (v / max) * (H - b - 10);
  const court = (v) => (v >= 1e6 ? nb(Math.round(v / 1e5) / 10) + ' M' : v >= 1000 ? nb(Math.round(v / 100) / 10) + ' k' : nb(v));
  let out = [0, max / 2, max].map((v) => `<line x1="${g}" x2="${L}" y1="${H - b - y(v)}" y2="${H - b - y(v)}" stroke="rgba(255,255,255,.07)"/><text x="${g - 6}" y="${H - b - y(v) + 4}" text-anchor="end">${court(v)}</text>`).join('');
  donnees.forEach((d, i) => {
    let acc = 0;
    for (const p of piles) { const h = y(d[p.cle] || 0); if (h > 0) out += `<rect x="${(g + i * w + 1.5).toFixed(1)}" y="${(H - b - acc - h).toFixed(1)}" width="${Math.max(1, w - 3).toFixed(1)}" height="${h.toFixed(1)}" fill="${p.couleur}" rx="1.5"><title>${esc(p.nom)} : ${nb(d[p.cle])} FC</title></rect>`; acc += h; }
    if ((n - 1 - i) % 7 === 0) out += `<text x="${(g + i * w + w / 2).toFixed(1)}" y="${H - 5}" text-anchor="middle">${new Date(d.jour).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' })}</text>`;
  });
  return `<div class="legende">${piles.map((p) => `<span><i style="background:${p.couleur}"></i>${esc(p.nom)}</span>`).join('')}</div>
    <svg class="graphe" viewBox="0 0 ${L} ${H}" preserveAspectRatio="none" role="img" aria-label="Revenus par jour">${out}</svg>`;
}
function carteHeures(cases) {
  const J = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'], cw = 15, ch = 17, g = 30;
  const v = {}; let max = 1;
  for (const c of cases) { v[c.jour + '-' + c.heure] = c.parties; max = Math.max(max, c.parties); }
  let s = '';
  J.forEach((j, r) => {
    s += `<text x="0" y="${r * ch + 12}">${j}</text>`;
    for (let h = 0; h < 24; h++) { const n = v[(r + 1) + '-' + h] || 0; s += `<rect x="${g + h * cw}" y="${r * ch}" width="${cw - 2}" height="${ch - 2}" rx="2.5" fill="#e2b04a" fill-opacity="${(0.06 + (n / max) * 0.9).toFixed(2)}"><title>${j} ${h} h : ${nb(n)} partie${n > 1 ? 's' : ''}</title></rect>`; }
  });
  [0, 6, 12, 18, 23].forEach((h) => (s += `<text x="${g + h * cw + 6}" y="${7 * ch + 12}" text-anchor="middle">${h} h</text>`));
  return `<svg class="hm" viewBox="0 0 ${g + 24 * cw + 8} ${7 * ch + 16}" style="width:100%;display:block" role="img" aria-label="Parties par heure">${s}</svg>`;
}
// Évolution par rapport à la période d'avant : « ▲ 12 % », « ▼ 3 % », ou rien sans point de comparaison.
function evolution(maintenant, avant) {
  if (!avant) return maintenant ? '<span class="d neutre">nouveau</span>' : '<span class="d neutre">—</span>';
  const p = Math.round((100 * (maintenant - avant)) / avant);
  return p === 0 ? '<span class="d neutre">= stable</span>' : `<span class="d ${p > 0 ? 'haut' : 'bas'}">${p > 0 ? '▲' : '▼'} ${Math.abs(p)} %</span>`;
}

async function afficherBief(fleuve, bief) {
  const l = await api(`/fleuve/${fleuve}/biefs/${bief}`);
  const robots = { faciles: 'Faciles', normaux: 'Normaux', forts: 'Forts' };
  $('#contenu').innerHTML = `<h2><button class="lien" id="retourFleuve">Le Fleuve</button> › ${esc(NOMS_FLEUVES[fleuve] || fleuve)}, bief ${bief}</h2>
    <p class="muted">Force des robots de 1 à 60 (Faciles 1 à 20, Normaux 21 à 40, Forts 41 à 60). Réussite : visée → obtenue par le robot testeur. Chiffres réels : essais des joueurs, part des joueurs qui réussissent au premier essai. ⚠ : bien plus dur que prévu.</p>
    <div class="carte defile"><table><tr><th class="n">N°</th><th>Ville</th><th class="n">Table</th><th>Robots</th><th>Objectif</th><th class="n">Réussite</th><th class="n">Étoiles 2 · 3</th><th class="n">Essais</th><th class="n">1er essai</th><th></th></tr>
    ${l.map((e) => `<tr><td class="n">${e.numero}</td><td>${e.escale ? '<b>' + esc(e.ville) + '</b> (boss)' : '<span class="muted">' + esc(e.ville) + '</span>'}</td><td class="n">${e.joueurs}</td><td>${robots[e.robots] || esc(e.robots)} ${e.force} <span class="muted">(${e.d})</span></td><td>${esc(e.texte)}${e.pieges.length ? '<br><small class="muted">Piège : ' + e.pieges.map((p) => esc(p.texte)).join(', ') + '</small>' : ''}</td><td class="n${e.horsCible ? ' ko' : ''}">${e.vise} → ${e.taux} %</td><td class="n">${e.seuils.deux} · ${e.seuils.trois}</td><td class="n">${nb(e.chiffres.essais)}</td><td class="n">${e.chiffres.premier === null ? '—' : e.chiffres.premier + ' %'}${e.chiffres.bloque ? ' <span class="ko">⚠</span>' : ''}</td><td style="white-space:nowrap"><button class="btn" data-force="${e.numero}" data-d="${e.d}">Force</button> <button class="btn" data-refaire="${e.numero}">Refaire</button></td></tr>`).join('')}</table></div>`;
  $('#retourFleuve').onclick = () => aller('fleuve');
  const action = async (fn) => { try { await fn(); message('Étape mise à jour.'); } catch (e) { message(e.message); } afficherBief(fleuve, bief).catch((e) => message(e.message)); };
  $('#contenu').querySelectorAll('[data-force]').forEach((b) => (b.onclick = () => {
    const d = prompt('Force des robots (1 à 60). Les seuils des étoiles seront recalculés.', b.dataset.d);
    if (d !== null && d !== '') action(() => api(`/fleuve/${fleuve}/etapes/${b.dataset.force}/modifier`, { methode: 'POST', corps: { d: Number(d) } }));
  }));
  $('#contenu').querySelectorAll('[data-refaire]').forEach((b) => (b.onclick = () => {
    if (confirm(`Refaire l'étape ${b.dataset.refaire} (nouvel objectif, nouvelle donne) ? Ceux qui l'ont réussie gardent leurs étoiles.`)) { b.disabled = true; b.textContent = '…'; action(() => api(`/fleuve/${fleuve}/etapes/${b.dataset.refaire}/refaire`, { methode: 'POST' })); }
  }));
}

afficher.suspects = async function suspects() {

  $('#contenu').innerHTML = `<h2>Comptes suspects</h2>
    <p class="muted">Deux comptes qui ont joué au moins ${s.min} parties seuls ensemble ces ${s.jours} derniers jours, gagnées à ${s.pourcent} % ou plus par le même : peut-être un joueur qui se fait donner des pièces ou des points de ligue par un faux compte. Ouvre les fiches pour décider. Seuils : <button class="lien" id="versSecurite">Réglages > Sécurité</button>.</p>

  lierJoueurs();
  $('#versSecurite').onclick = () => aller('reglages', 'securite');
};

const lireChemin = (o, c) => c.split('.').reduce((x, k) => (x == null ? undefined : x[k]), o);
function ecrireChemin(o, c, v) { const ks = c.split('.'); let x = o; for (const k of ks.slice(0, -1)) { if (x[k] == null) x[k] = /^\d+$/.test(k) ? [] : {}; x = x[k]; } x[ks.at(-1)] = v; }
const kinVersLocal = (iso) => (iso ? new Date(Date.parse(iso) + 36e5).toISOString().slice(0, 16) : ''); // ISO UTC → champ datetime-local à l'heure de Kinshasa
const localVersIso = (t) => (t ? new Date(t + ':00+01:00').toISOString() : '');
const sansAccents = (t) => String(t).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
function affichageValeur(ch, v) {
  if (ch.t === 'b' || ch.t === 'b01') return OUI_NON(ch.t === 'b01' ? Number(v) === 1 : !!v);
  if (ch.t === 'choix') return ((ch.o.find(([x]) => x === v) || [])[1]) || String(v ?? '');
  if (ch.t === 'date') return v ? date(v) + ' (Kinshasa)' : 'vide';
  if (ch.t === 'zone' || ch.t === 'virgules') return (v || []).length + ' élément(s)';
  if (ch.t === 'n') return v == null ? 'vide' : String(v).replace('.', ',') + (ch.u ? ' ' + ch.u : '');
  return v === '' || v == null ? 'vide' : '« ' + String(v) + ' »';
}
