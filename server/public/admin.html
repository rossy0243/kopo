afficher.reglages = async function reglages(onglet) {
  const [r, defauts] = await Promise.all([api('/reglages'), api('/reglages/defauts')]);
  // Valeurs de départ des bouquets : la liste du serveur (bouquets.js) quand le réglage n'a jamais été enregistré.
  if (!r.bouquets || !Array.isArray(r.bouquets.bouquets)) r.bouquets = { bouquets: [] };
  if (!defauts.bouquets || !Array.isArray(defauts.bouquets.bouquets)) defauts.bouquets = { bouquets: [] };
  const origine = JSON.parse(JSON.stringify(r));
  const brouillon = JSON.parse(JSON.stringify(r));
  const nbBouquets = () => (brouillon.bouquets.bouquets || []).length;
  let ouvert = ONGLETS_REGLAGES.some((o) => o.id === onglet) ? onglet : (() => { try { return localStorage.getItem('kopo-admin-onglet') || 'acces'; } catch (e) { return 'acces'; } })();
  if (!ONGLETS_REGLAGES.some((o) => o.id === ouvert)) ouvert = 'acces';
  let recherche = '';
  const champsVisibles = (o) => CHAMPS.filter((ch) => ch.onglet === o && (ch.bouquet === undefined || ch.bouquet < nbBouquets()));
  const modifs = () => CHAMPS.filter((ch) => !egal(lireChemin(origine, ch.c), lireChemin(brouillon, ch.c)));
  reglagesEnCours = { modifs };

  const id = (c) => 'r_' + c.replace(/\./g, '_');
  function saisie(ch) {
    const v = lireChemin(brouillon, ch.c);
    if (ch.t === 'b' || ch.t === 'b01') return `<label class="bascule"><input type="checkbox" id="${id(ch.c)}" data-c="${ch.c}" ${(ch.t === 'b01' ? Number(v) === 1 : !!v) ? 'checked' : ''} aria-label="${esc(ch.l)}"><span></span></label>`;
    if (ch.t === 'choix') return `<select id="${id(ch.c)}" data-c="${ch.c}">${ch.o.map(([x, l]) => `<option value="${esc(x)}" ${x === v ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
    if (ch.t === 'zone') return `<textarea id="${id(ch.c)}" data-c="${ch.c}" rows="8" style="font-size:16px">${esc((v || []).join('\n'))}</textarea>`;
    if (ch.t === 'virgules') return `<input id="${id(ch.c)}" data-c="${ch.c}" value="${esc((v || []).join(', '))}" autocomplete="off" list="suggestionsTesteurs"><datalist id="suggestionsTesteurs"></datalist>`;
    if (ch.t === 'date') return `<input type="datetime-local" id="${id(ch.c)}" data-c="${ch.c}" value="${kinVersLocal(v)}">`;
    if (ch.t === 'texte') return `<input id="${id(ch.c)}" data-c="${ch.c}" value="${esc(v ?? '')}" placeholder="${esc(ch.ph || '')}" ${ch.large ? '' : 'style="width:220px"'}>`;
    return `<span class="unite"><input id="${id(ch.c)}" data-c="${ch.c}" inputmode="decimal" value="${v == null ? '' : String(v).replace('.', ',')}" aria-label="${esc(ch.l)}"><em>${esc(ch.u || '')}</em></span>`;
  }
  function champ(ch) {
    const d = lireChemin(defauts, ch.c), v = lireChemin(brouillon, ch.c);
    const montrerDefaut = d !== undefined && ch.t !== 'zone' && !(ch.t === 'texte' && !d);
    const mod = !egal(lireChemin(origine, ch.c), v);
    return `<div class="champ${ch.large ? ' large' : ''}${mod ? ' modifie' : ''}" data-champ="${ch.c}">
      <div class="l"><label for="${id(ch.c)}">${esc(ch.l)}</label>${ch.nouveau ? ' <span class="nouv">nouveau</span>' : ''}<small>${ch.a ? esc(ch.a) + ' ' : ''}${montrerDefaut ? `<span class="def">Par défaut : ${esc(affichageValeur(ch, d))}.</span>` : ''}</small></div>
      <div class="saisie">${montrerDefaut && !egal(v, d) ? `<button class="lien raz" data-raz="${ch.c}">rétablir</button>` : ''}<span class="marque"></span>${saisie(ch)}</div>
      <div class="erreur" hidden></div></div>`;
  }
  function section(s, o) {
    let corps = s.champs.filter((ch) => ch.bouquet === undefined || ch.bouquet < nbBouquets()).map(champ).join('');
    if (s.lienLigue) corps += '<div class="ligne"><button class="btn" data-aller="ligue">Ouvrir Ligue et saisons</button></div>';
    if (s.groupes) corps += '<div id="groupes"></div><div class="ligne"><button class="btn" id="btnAjoutGroupe">+ Ajouter un groupe</button><button class="btn principal" id="btnGroupes">Enregistrer les groupes</button></div>';
    if (s.cadeau) corps += `<div class="ligne"><input id="cadeauMontant" type="number" min="1" placeholder="Pièces" style="width:110px"><input id="cadeauMotif" placeholder="Motif (ex. excuses pour la panne)" style="flex:1;min-width:200px"><button class="btn" id="btnCadeau">Envoyer</button></div><p class="muted" style="margin:0">Part tout de suite à tous les joueurs actifs (pas besoin d'enregistrer).</p>`;
    if (s.bouquets) corps += `<div class="ligne">${nbBouquets() < 8 ? '<button class="btn" id="btnAjoutBouquet">+ Ajouter un bouquet</button>' : ''}${nbBouquets() > 1 ? '<button class="btn" id="btnRetraitBouquet">Retirer le dernier</button>' : ''}</div>`;
    return `<div class="carte"><h3>${esc(s.titre)}</h3>${s.aide ? `<p class="muted" style="margin:-4px 0 6px;font-size:13px">${esc(s.aide)}</p>` : ''}${corps}</div>`;
  }
  // Colonne de droite de « Rythme des parties » : ce que les joueurs attendent, hors coups.
  function coteRythme() {
    const k = brouillon.rythme.kopo, ko = origine.rythme.kopo, i = brouillon.rythme.inter8, io = origine.rythme.inter8;
    const s = (x) => String(Math.round(x * 10) / 10).replace('.', ',') + ' s';
    const l = (t, a, b) => `<div class="ligne-v"><span>${t}</span><span>${a === b ? `<b>${s(b)}</b>` : `<span class="avant">${s(a)}</span> → <b>${s(b)}</b>`}</span></div>`;
    return `<div class="carte cote"><h3>Attentes fixes</h3><p class="muted" style="margin:-4px 0 6px;font-size:13px">Temps où personne ne joue, hors réflexion des joueurs.</p>
      ${l('Kopo : par pli', ko.finTour, k.finTour)}${l('Kopo : entre deux manches', ko.depart + ko.mancheAuto, k.depart + k.mancheAuto)}
      ${l('Inter (8) : entre deux donnes', io.depart + io.mancheAuto, i.depart + i.mancheAuto)}
      <div class="note" style="margin-top:10px">Effet dès la prochaine table ouverte, sans mise à jour de l'appli. Les parties contre les robots du site prennent aussi ces temps.</div></div>`;
  }
  function dessiner() {
    const q = sansAccents(recherche.trim());
    const ong = ONGLETS_REGLAGES.find((o) => o.id === ouvert);
    const modTab = new Set(modifs().map((ch) => ch.onglet));
    let contenu;
    if (q) {
      const trouves = CHAMPS.filter((ch) => (ch.bouquet === undefined || ch.bouquet < nbBouquets()) && sansAccents(ch.l + ' ' + (ch.a || '') + ' ' + ch.section).includes(q));
      contenu = trouves.length ? ONGLETS_REGLAGES.filter((o) => trouves.some((ch) => ch.onglet === o.id)).map((o) => `<div class="carte"><h3>${esc(o.titre)}</h3>${trouves.filter((ch) => ch.onglet === o.id).map(champ).join('')}</div>`).join('')
        : `<p class="muted">Aucun réglage ne correspond à « ${esc(recherche)} ».</p>`;
    } else {
      contenu = ong.cote === 'rythme' ? `<div class="reg-grille"><div>${ong.sections.map((s) => section(s, ong)).join('')}</div><div>${coteRythme()}</div></div>` : ong.sections.map((s) => section(s, ong)).join('');
    }
    $('#contenu').innerHTML = `<div class="tete"><div><h2>${page === 'annonces' ? 'Annonces et événements' : 'Réglages du jeu'}</h2><div class="sous">Appliqués tout de suite, sans mise à jour de l'appli. Chaque changement est noté au Journal, avec l'ancienne valeur.</div></div><span class="esp"></span>
        <input type="search" class="recherche" id="rechercheReglage" placeholder="Chercher un réglage (ex. robots, bonus)" value="${esc(recherche)}" aria-label="Chercher un réglage"></div>
      ${q ? '' : `<div class="onglets" role="tablist">${ONGLETS_REGLAGES.map((o) => `<button role="tab" data-onglet="${o.id}" aria-selected="${o.id === ouvert}">${esc(o.titre)}${o.nouveau ? ' <span class="nouv">nouveau</span>' : ''}${modTab.has(o.id) ? '<span class="pt" title="changements non enregistrés"></span>' : ''}</button>`).join('')}</div>`}
      <div id="reglagesCorps">${contenu}</div>`;
    lier();
    barre();
  }
  // Remplacer le champ fait perdre le focus, ce qui relance « change » : on ignore cet appel imbriqué.
  let majEnCours = false;
  function majChamp(c) {
    const ch = CHAMPS.find((x) => x.c === c), el = $('#contenu').querySelector(`[data-champ="${c}"]`);
    if (!el || majEnCours) return;
    majEnCours = true;
    try { el.outerHTML = champ(ch); } finally { majEnCours = false; }
    lierChamp($('#contenu').querySelector(`[data-champ="${c}"]`));
    if (ouvert === 'rythme' && !recherche) { const cote = $('#contenu').querySelector('.cote'); if (cote) cote.outerHTML = coteRythme(); }
    const modTab = new Set(modifs().map((x) => x.onglet));
    $('#contenu').querySelectorAll('[data-onglet]').forEach((b) => { const pt = b.querySelector('.pt'); if (modTab.has(b.dataset.onglet) && !pt) b.insertAdjacentHTML('beforeend', '<span class="pt" title="changements non enregistrés"></span>'); if (!modTab.has(b.dataset.onglet) && pt) pt.remove(); });
    barre();
  }
  function lire(ch, el) {
    if (ch.t === 'b') return el.checked;
    if (ch.t === 'b01') return el.checked ? 1 : 0;
    if (ch.t === 'zone') return el.value.split('\n').map((x) => x.trim()).filter(Boolean);
    if (ch.t === 'virgules') return el.value.split(',').map((x) => x.trim()).filter(Boolean);
    if (ch.t === 'date') return localVersIso(el.value);
    if (ch.t === 'n') { const t = el.value.trim().replace(',', '.'); return t === '' ? null : Number(t); }
    return el.value;
  }
  function lierChamp(el) {
    if (!el) return;
    const ch = CHAMPS.find((x) => x.c === el.dataset.champ), inp = el.querySelector('[data-c]'), err = el.querySelector('.erreur');
    const verifier = (v) => {
      if (ch.t !== 'n') return '';
      if (v === null || !Number.isFinite(v)) return 'Écris un nombre.';
      if (ch.min !== undefined && v < ch.min) return `Au moins ${String(ch.min).replace('.', ',')}.`;
      if (ch.max !== undefined && v > ch.max) return `Au plus ${String(ch.max).replace('.', ',')}.`;
      if (!ch.pas && !Number.isInteger(v)) return 'Un nombre entier.';
      return '';
    };
    const changer = () => {
      const v = lire(ch, inp), e = verifier(v);
      err.textContent = e; err.hidden = !e;
      if (e) return;
      // Interrupteur sensible (fermer le jeu, fermer les comptes sans Google) : on demande avant de le basculer du mauvais côté.
      if (ch.danger && inp.checked === ch.dangerSi && !confirm(ch.danger)) { inp.checked = !inp.checked; return; }
      ecrireChemin(brouillon, ch.c, v);
      const garde = document.activeElement === inp, pos = garde && inp.selectionStart;
      majChamp(ch.c);
      if (garde && ch.t !== 'b' && ch.t !== 'b01' && ch.t !== 'choix') { const n = $('#' + id(ch.c)); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (er) {} } }
    };
    inp.addEventListener(ch.t === 'n' || ch.t === 'texte' || ch.t === 'zone' || ch.t === 'virgules' ? 'change' : 'input', changer);
    if (ch.t === 'n' || ch.t === 'texte') inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') changer(); });
    const raz = el.querySelector('[data-raz]');
    if (raz) raz.onclick = () => { ecrireChemin(brouillon, ch.c, JSON.parse(JSON.stringify(lireChemin(defauts, ch.c)))); majChamp(ch.c); };
    if (ch.t === 'virgules') suggestionsTesteurs(inp);
  }
  function lier() {
    $('#contenu').querySelectorAll('[data-champ]').forEach(lierChamp);
    $('#contenu').querySelectorAll('[data-onglet]').forEach((b) => (b.onclick = () => { ouvert = b.dataset.onglet; try { localStorage.setItem('kopo-admin-onglet', ouvert); } catch (e) {} dessiner(); }));
    $('#contenu').querySelectorAll('[data-aller]').forEach((b) => (b.onclick = () => aller(b.dataset.aller)));
    const rch = $('#rechercheReglage');
    rch.oninput = () => { recherche = rch.value; const p = rch.selectionStart; dessiner(); const n = $('#rechercheReglage'); n.focus(); n.setSelectionRange(p, p); };
    if ($('#groupes')) groupesCommunaute(r.communautes);
    if ($('#btnCadeau')) $('#btnCadeau').onclick = async () => {
      const montant = Number($('#cadeauMontant').value);
      if (!(montant > 0)) return message('Écris un nombre de pièces.');
      if (!confirm(`Donner ${nb(montant)} pièces à tous les joueurs actifs ? C'est immédiat.`)) return;
      try { const x = await api('/cadeau', { methode: 'POST', corps: { montant, motif: $('#cadeauMotif').value } }); message(`Cadeau envoyé à ${nb(x.joueurs)} joueurs.`); $('#cadeauMontant').value = ''; } catch (e) { message(e.message); }
    };
    if ($('#btnAjoutBouquet')) $('#btnAjoutBouquet').onclick = () => { const l = brouillon.bouquets.bouquets, d = l.at(-1) || { francs: 0, pieces: 0 }; l.push({ francs: Math.min(40000, d.francs * 2 || 500), pieces: Math.max(200, d.pieces * 2) }); dessiner(); };
    if ($('#btnRetraitBouquet')) $('#btnRetraitBouquet').onclick = () => { brouillon.bouquets.bouquets.pop(); dessiner(); };
  }
  // Barre du bas : nombre de changements, Tout annuler, Enregistrer… (récapitulatif avant → après).
  function barre() {
    const m = modifs();
    let b = $('#barreEnregistrer');
    if (!m.length && !bouquetsModifies()) { if (b) b.remove(); return; }
    if (!b) { b = document.createElement('div'); b.id = 'barreEnregistrer'; document.body.append(b); }
    const n = m.length || 1;
    b.innerHTML = `<span class="pt"></span><b>${n} changement${n > 1 ? 's' : ''} non enregistré${n > 1 ? 's' : ''}</b><span class="esp"></span><button class="btn" id="btnAnnulerTout">Tout annuler</button><button class="btn principal" id="btnEnregistrer">Enregistrer…</button>`;
    $('#btnAnnulerTout').onclick = () => { for (const k of Object.keys(brouillon)) delete brouillon[k]; Object.assign(brouillon, JSON.parse(JSON.stringify(origine))); dessiner(); };
    $('#btnEnregistrer').onclick = confirmer;
  }
  const bouquetsModifies = () => !egal(origine.bouquets.bouquets, brouillon.bouquets.bouquets);
  function confirmer() {
    const m = modifs();
    const champsBouquets = bouquetsModifies() && !m.some((ch) => ch.c.startsWith('bouquets.'));
    const f = document.createElement('div');
    f.className = 'fenetre-fond';
    f.innerHTML = `<div class="fenetre" role="dialog" aria-modal="true" aria-labelledby="titreVerif"><h3 id="titreVerif">Vérifier avant d'enregistrer</h3>
      <div class="defile"><table class="diff">${m.map((ch) => `<tr><td>${esc((ONGLETS_REGLAGES.find((o) => o.id === ch.onglet) || {}).titre || '')}<br><b>${esc(ch.l)}</b></td><td class="n"><span class="avant">${esc(affichageValeur(ch, lireChemin(origine, ch.c)))}</span><br>→ <b>${esc(affichageValeur(ch, lireChemin(brouillon, ch.c)))}</b></td></tr>`).join('')}
      ${champsBouquets ? `<tr><td>Ventes<br><b>Nombre de bouquets</b></td><td class="n"><span class="avant">${origine.bouquets.bouquets.length}</span><br>→ <b>${nbBouquets()}</b></td></tr>` : ''}</table></div>
      <div class="ligne" style="justify-content:flex-end;margin-top:14px"><button class="btn" id="verifRetour">Retour</button><button class="btn principal" id="verifOk">Confirmer et enregistrer</button></div></div>`;
    document.body.append(f);
    $('#verifOk').focus();
    const fermer = () => f.remove();
    f.onclick = (e) => { if (e.target === f) fermer(); };
    f.addEventListener('keydown', (e) => { if (e.key === 'Escape') fermer(); });
    $('#verifRetour').onclick = fermer;
    $('#verifOk').onclick = async () => {
      $('#verifOk').disabled = true;
      const cles = [...new Set(m.map((ch) => ch.c.split('.')[0]).concat(bouquetsModifies() ? ['bouquets'] : []))];
      const erreurs = [];
      for (const cle of cles) {
        try { const x = await api('/reglages/' + cle, { methode: 'PUT', corps: { valeur: brouillon[cle] } }); origine[cle] = JSON.parse(JSON.stringify(x.valeur)); brouillon[cle] = JSON.parse(JSON.stringify(x.valeur)); }
        catch (e) { erreurs.push(e.message); }
      }
      fermer();
      dessiner();
      message(erreurs.length ? 'Pas enregistré : ' + erreurs.join(' ') : 'Enregistré. Noté au Journal.');
    };
  }
  dessiner();
};
afficher.pilotage = afficher.reglages; // ancien nom de la page
afficher.annonces = () => afficher.reglages('annonces');

// Pseudos des testeurs : suggestions des joueurs qui existent, pendant qu'on tape (après la dernière virgule).
function suggestionsTesteurs(inp) {
  let m = null;
  inp.addEventListener('input', () => {
    clearTimeout(m);
    m = setTimeout(async () => {
      const val = inp.value, i = val.lastIndexOf(',');
      const debut = i >= 0 ? val.slice(0, i + 1) + ' ' : '', mot = val.slice(i + 1).trim();
      const liste = $('#suggestionsTesteurs');
      if (!liste) return;
      if (mot.length < 2) return liste.replaceChildren();
      try {
        const r2 = await api('/joueurs?q=' + encodeURIComponent(mot));
        const pseudos = [...new Set(r2.joueurs.map((j) => j.pseudo))].slice(0, 12);
        liste.replaceChildren(...pseudos.map((ps) => { const o = document.createElement('option'); o.value = debut + ps; return o; }));
      } catch (e) {}
    }, 250);
  });
}
// Suggestions de joueurs dans tous les champs qui attendent un joueur (attribut data-joueurs) : dès 2 lettres, les
// comptes qui ressemblent (pseudo, e-mail, identifiant), à choisir sous la forme Pseudo#1234.
(() => {
  let minuteur = null, n = 0;
  document.addEventListener('input', (ev) => {
    const inp = ev.target;
    if (!(inp instanceof HTMLInputElement) || !inp.hasAttribute('data-joueurs')) return;
    if (!inp.list) {
      const l = document.createElement('datalist');
      l.id = 'suggestionsJoueurs' + (++n);
      inp.after(l); inp.setAttribute('list', l.id);
    }
    const liste = inp.list, mot = inp.value.trim();
    clearTimeout(minuteur);
    if (mot.length < 2 || /#\d{4}$/.test(mot)) return liste.replaceChildren();
    minuteur = setTimeout(async () => {
      try {
        const r = await api('/joueurs?q=' + encodeURIComponent(mot.replace(/#\d{0,3}$/, '')));
        if (inp.value.trim() !== mot) return;
        liste.replaceChildren(...r.joueurs.filter((j) => j.statut !== 'supprime').slice(0, 10).map((j) => {
          const o = document.createElement('option');
          o.value = `${j.pseudo}#${j.numero}`;
          o.label = [j.kopoPlus ? 'Kopo+' : '', j.lie ? 'Google' : 'invité', j.email || '', j.statut !== 'actif' ? j.statut : ''].filter(Boolean).join(' · ');
          return o;
        }));
      } catch (e) {}
    }, 250);
  });
})();
// Groupes de la communauté : une ligne par groupe (réseau, nom, lien, visible), qu'on monte, descend ou supprime.
function groupesCommunaute(liste) {
  const RESEAUX = [['whatsapp', 'WhatsApp'], ['telegram', 'Telegram'], ['facebook', 'Facebook'], ['instagram', 'Instagram'], ['tiktok', 'TikTok'], ['youtube', 'YouTube'], ['x', 'X'], ['discord', 'Discord'], ['autre', 'Autre']];
  let groupes = (liste || []).map((g) => ({ ...g }));
  const lireGroupes = () => $('#groupes').querySelectorAll('[data-groupe]').forEach((l) => {
    const g = groupes[+l.dataset.groupe];
    g.reseau = l.querySelector('select').value; g.libelle = l.querySelector('.g-nom').value; g.url = l.querySelector('.g-url').value; g.visible = l.querySelector('.g-vis').checked;
  });
  const dessinerGroupes = () => {
    $('#groupes').innerHTML = groupes.length ? groupes.map((g, i) => `<div class="ligne" data-groupe="${i}">
      <select aria-label="Réseau">${RESEAUX.map(([v, t]) => `<option value="${v}" ${g.reseau === v ? 'selected' : ''}>${t}</option>`).join('')}</select>
      <input class="g-nom" value="${esc(g.libelle || '')}" placeholder="Nom (ex. Kopo Kinshasa)" maxlength="40" style="width:200px" aria-label="Nom">
      <input class="g-url" value="${esc(g.url || '')}" placeholder="https://chat.whatsapp.com/…" style="flex:1;min-width:220px" aria-label="Lien">
      <label><input type="checkbox" class="g-vis" ${g.visible !== false ? 'checked' : ''}> visible</label>
      <button class="btn icone" data-monter="${i}" ${i ? '' : 'disabled'} title="Monter">↑</button><button class="btn icone" data-descendre="${i}" ${i < groupes.length - 1 ? '' : 'disabled'} title="Descendre">↓</button><button class="btn icone" data-suppr="${i}" title="Supprimer">✕</button>
    </div>`).join('') : '<p class="muted">Aucun groupe pour l\'instant.</p>';
    const deplacer = (i, j) => { lireGroupes(); [groupes[i], groupes[j]] = [groupes[j], groupes[i]]; dessinerGroupes(); };
    $('#groupes').querySelectorAll('[data-monter]').forEach((b) => (b.onclick = () => deplacer(+b.dataset.monter, +b.dataset.monter - 1)));
    $('#groupes').querySelectorAll('[data-descendre]').forEach((b) => (b.onclick = () => deplacer(+b.dataset.descendre, +b.dataset.descendre + 1)));
    $('#groupes').querySelectorAll('[data-suppr]').forEach((b) => (b.onclick = () => { lireGroupes(); groupes.splice(+b.dataset.suppr, 1); dessinerGroupes(); }));
  };
  dessinerGroupes();
  $('#btnAjoutGroupe').onclick = () => { lireGroupes(); groupes.push({ reseau: 'whatsapp', libelle: '', url: '', visible: true }); dessinerGroupes(); };
  $('#btnGroupes').onclick = async () => {
    lireGroupes();
    try { const x = await api('/reglages/communautes', { methode: 'PUT', corps: { valeur: groupes } }); groupes = x.valeur; dessinerGroupes(); message('Groupes enregistrés.'); } catch (e) { message(e.message); }
  };
}

if (jeton) demarrer(); else afficherConnexion();
